<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigEd CC — Operator Console</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0e1a; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        #loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            background: #0a0e1a; color: #e2e8f0; z-index: 100;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .spinner {
            width: 32px; height: 32px; border: 3px solid #1e293b;
            border-top-color: #3b82f6; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading.loaded { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="loading">
        <div style="text-align:center">
            <div class="spinner"></div>
            <div>Loading BigEd CC...</div>
        </div>
    </div>
    <canvas id="biged-canvas"></canvas>
    <script type="module">
        import init from './pkg/biged_wasm.js';
        init().then(() => {
            document.getElementById('loading').classList.add('loaded');
        }).catch(err => {
            document.getElementById('loading').textContent = 'Failed to load: ' + err;
        });
    </script>
</body>
</html>
