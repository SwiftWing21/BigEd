<script>
/* ── State ────────────────────────────────────────────────────────────────── */
var _loaded = {};
var _sseSource = null;
var _sseConnected = false;
var _cyInstance = null;
var _charts = {};
var _queuePaused = false;
var _dragSrcIdx = null;

/* ── Escape HTML (XSS prevention) ─────────────────────────────────────────── */
function escH(s) {
  if (s === null || s === undefined) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(String(s)));
  return d.innerHTML;
}

/* ── Safe DOM builder helpers ─────────────────────────────────────────────── */
function createEl(tag, attrs, children) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === 'className') el.className = attrs[k];
      else if (k === 'textContent') el.textContent = attrs[k];
      else if (k.indexOf('on') === 0) el.setAttribute(k, attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
  }
  if (children) {
    if (typeof children === 'string') el.textContent = children;
    else if (Array.isArray(children)) children.forEach(function(c) {
      if (typeof c === 'string') el.appendChild(document.createTextNode(c));
      else if (c) el.appendChild(c);
    });
  }
  return el;
}

/* ── Theme ────────────────────────────────────────────────────────────────── */
function setTheme(theme) {
  var resolved = theme === 'system'
    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : theme;
  document.documentElement.classList.toggle('dark', resolved === 'dark');
  document.cookie = 'biged-theme=' + theme + ';path=/;max-age=31536000';
  document.querySelectorAll('.theme-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.theme === theme);
  });
  Object.keys(_charts).forEach(function(k) {
    if (_charts[k]) { try { _charts[k].update(); } catch(e) {} }
  });
}
(function initTheme() {
  var m = document.cookie.match(/biged-theme=(\w+)/);
  setTheme(m ? m[1] : 'system');
  // React to OS theme changes when in system mode
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    var cm = document.cookie.match(/biged-theme=(\w+)/);
    if (!cm || cm[1] === 'system') setTheme('system');
  });
})();

function isDark() {
  return document.documentElement.classList.contains('dark');
}

/* ── Navigation ───────────────────────────────────────────────────────────── */
function showSection(name) {
  document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
  var el = document.getElementById('section-' + name);
  if (el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var nav = document.querySelector('[data-section="' + name + '"]');
  if (nav) nav.classList.add('active');
  document.getElementById('header-section-title').textContent =
    name.charAt(0).toUpperCase() + name.slice(1);
  closeSidebar();
  // Stop spatial map polling when leaving factorio tab
  if (name !== 'factorio') _stopSpatialMapPolling();
  if (!_loaded[name]) {
    _loaded[name] = true;
    loadSectionData(name);
  }
}

function loadSectionData(name) {
  switch (name) {
    case 'dashboard': loadDashboard(); break;
    case 'fleet': loadFleet(); loadServiceStatus(); break;
    case 'tasks': loadTasks(); break;
    case 'hitl': loadHITL(); loadUnreviewedOutputs(); break;
    case 'queue': loadQueue(); break;
    case 'analytics': loadAnalytics(); break;
    case 'docs': if (!_currentDocSlug) loadDoc('roadmap'); loadOutputsCategories(); break;
    case 'settings': loadSettings(); break;
    case 'views': loadViews(); break;
    case 'ingest': loadIngest(); break;
    case 'modules': loadModules(); break;
    case 'factorio': loadFactorio(); _startSpatialMapPolling(); break;
  }
}

/* ── Mobile Sidebar ───────────────────────────────────────────────────────── */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

/* ── Sub-Panel Tabs ───────────────────────────────────────────────────────── */
function showSubPanel(section, panel, btn) {
  var container = document.getElementById('section-' + section);
  container.querySelectorAll('.sub-panel').forEach(function(p) { p.classList.remove('active'); });
  container.querySelectorAll('.tab-group-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById(section + '-' + panel).classList.add('active');
  btn.classList.add('active');
  if (panel === 'neural' && !_cyInstance) { loadNeuralGraph(); }
}

/* ── Toast Notifications ──────────────────────────────────────────────────── */
function showToast(message, type) {
  type = type || 'info';
  var c = document.getElementById('toast-container');
  var t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = message;
  c.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 3500);
}

/* ── Omnibox with dropdown ─────────────────────────────────────────────────── */
var _omniboxItems = [
  {label: 'Dashboard', section: 'dashboard', icon: '■'},
  {label: 'Fleet', section: 'fleet', icon: '⚙'},
  {label: 'Ingest', section: 'ingest', icon: '📥'},
  {label: 'Tasks', section: 'tasks', icon: '⚡'},
  {label: 'HITL', section: 'hitl', icon: '✍'},
  {label: 'Queue', section: 'queue', icon: '☰'},
  {label: 'Analytics', section: 'analytics', icon: '★'},
  {label: 'Docs', section: 'docs', icon: '📖'},
  {label: 'Views', section: 'views', icon: '◉'},
  {label: 'Settings', section: 'settings', icon: '⚙'},
  {label: 'API Keys', section: 'settings', icon: '🔑', keywords: 'key api credential secret'},
  {label: 'Thermal', section: 'dashboard', icon: '🔥', keywords: 'temperature cpu gpu'},
  {label: 'Neural Activity', section: 'dashboard', icon: '🧠', keywords: 'neural activity graph'},
];
var _omniboxIdx = -1;

function omniboxSuggest(query) {
  var dd = document.getElementById('omnibox-dropdown');
  var q = query.toLowerCase().trim();
  _omniboxIdx = -1;
  if (q.length < 1) { dd.style.display = 'none'; return; }

  var matches = _omniboxItems.filter(function(item) {
    return item.label.toLowerCase().indexOf(q) !== -1 ||
           item.section.indexOf(q) !== -1 ||
           (item.keywords && item.keywords.indexOf(q) !== -1);
  });

  dd.textContent = '';
  if (!matches.length) { dd.style.display = 'none'; return; }

  matches.forEach(function(m, i) {
    var row = document.createElement('div');
    row.style.cssText = 'padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;';
    row.setAttribute('data-idx', i);
    row.onmouseenter = function() {
      dd.querySelectorAll('div').forEach(function(d) { d.style.background = ''; });
      row.style.background = 'var(--border)';
      _omniboxIdx = i;
    };
    row.onclick = function() {
      showSection(m.section);
      document.getElementById('omnibox-input').value = '';
      dd.style.display = 'none';
    };
    var icon = document.createElement('span');
    icon.textContent = m.icon;
    icon.style.cssText = 'width:20px;text-align:center;';
    var text = document.createElement('span');
    text.textContent = m.label;
    var hint = document.createElement('span');
    hint.textContent = m.section;
    hint.style.cssText = 'margin-left:auto;font-size:10px;color:var(--muted-foreground);';
    row.appendChild(icon);
    row.appendChild(text);
    row.appendChild(hint);
    dd.appendChild(row);
  });
  dd.style.display = 'block';
}

function omniboxKeydown(e) {
  var dd = document.getElementById('omnibox-dropdown');
  var items = dd.querySelectorAll('div');
  if (e.key === 'Escape') { dd.style.display = 'none'; return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _omniboxIdx = Math.min(_omniboxIdx + 1, items.length - 1);
    items.forEach(function(d, i) { d.style.background = i === _omniboxIdx ? 'var(--border)' : ''; });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _omniboxIdx = Math.max(_omniboxIdx - 1, 0);
    items.forEach(function(d, i) { d.style.background = i === _omniboxIdx ? 'var(--border)' : ''; });
  } else if (e.key === 'Enter') {
    if (_omniboxIdx >= 0 && items[_omniboxIdx]) {
      items[_omniboxIdx].click();
    }
  }
}

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  if (!e.target.closest('.omnibox')) {
    document.getElementById('omnibox-dropdown').style.display = 'none';
  }
});

/* ── API Fetch Helper ─────────────────────────────────────────────────────── */
function apiFetch(url, opts) {
  opts = opts || {};
  opts.headers = opts.headers || {};
  if (opts.body && typeof opts.body === 'object') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  return fetch(url, opts).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

/* ── Format Helpers ───────────────────────────────────────────────────────── */
function timeAgo(ts) {
  if (!ts) return '--';
  var d = new Date(ts.replace(' ', 'T') + (ts.includes('Z') ? '' : 'Z'));
  var now = new Date();
  var diff = Math.floor((now - d) / 1000);
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function statusBadgeClass(status) {
  var s = (status || 'unknown').toLowerCase();
  if (s === 'active' || s === 'done' || s === 'online' || s === 'ok' || s === 'healthy') return 'badge-success';
  if (s === 'busy' || s === 'running' || s === 'warning' || s === 'degraded') return 'badge-warning';
  if (s === 'failed' || s === 'error' || s === 'critical' || s === 'unhealthy') return 'badge-danger';
  if (s === 'pending' || s === 'idle' || s === 'sleeping' || s === 'waiting' || s === 'offline') return 'badge-info';
  if (s === 'disabled') return 'badge-muted';
  return 'badge-muted';
}

function buildStatusBadge(status) {
  var span = document.createElement('span');
  span.className = 'badge ' + statusBadgeClass(status);
  span.textContent = status || 'unknown';
  return span;
}

function thermalColor(v, max) {
  max = max || 100;
  if (v >= max * 0.8) return 'hot';
  if (v >= max * 0.6) return 'warm';
  return 'cool';
}
function barColor(v, max) {
  max = max || 100;
  if (v >= max * 0.8) return 'var(--danger)';
  if (v >= max * 0.6) return 'var(--warning)';
  return 'var(--success)';
}
function chartFG() { return getComputedStyle(document.documentElement).getPropertyValue('--foreground').trim() || '#333'; }
function chartMuted() { return getComputedStyle(document.documentElement).getPropertyValue('--muted-foreground').trim() || '#888'; }
function chartBorder() { return getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || 'rgba(0,0,0,0.1)'; }

/* ══════════════════════════════════════════════════════════════════════════
   1. DASHBOARD
   ══════════════════════════════════════════════════════════════════════ */
function loadDashboard() {
  loadDashStatus();
  loadThermal();
  loadActivityChart();
  loadLiveActivity();  // initial fetch — SSE takes over for real-time updates
  loadDashSettings();
}

var _agentColors = {
  researcher: '#3b82f6', coder_1: '#f59e0b', coder_2: '#f59e0b', coder_3: '#f59e0b',
  archivist: '#8b5cf6', planner: '#06b6d4', security: '#ef4444', analyst: '#10b981',
  dr_ders: '#059669', supervisor: '#059669',
};
var _statusIcons = { RUNNING: '\u25B6', DONE: '\u2713', FAILED: '\u2717', PENDING: '\u25CB' };
var _statusColors = { RUNNING: '#3b82f6', DONE: '#10b981', FAILED: '#ef4444', PENDING: '#64748b' };

// ── Live Activity configurable columns ────────────────────────────────────
var _liveColumns = {
  model:    { label: 'Model',    default: true,  key: 'model' },
  duration: { label: 'Duration', default: true,  key: 'duration_s' },
  tokens:   { label: 'Tokens',   default: false, key: 'out_tokens' },
  speed:    { label: 'Speed',    default: false, key: 'tok_per_sec' },
  iq:       { label: 'IQ Score', default: true,  key: 'iq_score' },
  cost:     { label: 'Cost',     default: false, key: 'cost_usd' },
  priority: { label: 'Priority', default: false, key: 'priority' },
  trace:    { label: 'Trace ID', default: false, key: 'trace_id' },
};

function _getLiveColumnPrefs() {
  try {
    var saved = localStorage.getItem('biged_live_columns');
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  var defaults = {};
  Object.keys(_liveColumns).forEach(function(k) { defaults[k] = _liveColumns[k].default; });
  return defaults;
}

function _setLiveColumnPref(col, enabled) {
  var prefs = _getLiveColumnPrefs();
  prefs[col] = enabled;
  localStorage.setItem('biged_live_columns', JSON.stringify(prefs));
}

function _renderLiveItems(items) {
  var feed = document.getElementById('live-activity-feed');
  if (!feed) return;
  feed.textContent = '';
  if (!items || !items.length) {
    var empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;color:var(--muted-foreground);padding:20px;';
    empty.textContent = 'No recent activity';
    feed.appendChild(empty);
    return;
  }
  var prefs = _getLiveColumnPrefs();
  items.forEach(function(item) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px solid var(--border);';
    if (item.status === 'RUNNING') row.style.background = 'rgba(59,130,246,0.05)';
    // Priority tint
    if (item.priority && item.priority <= 2) row.style.borderLeft = '2px solid #ef4444';
    else if (item.priority === 5) row.style.opacity = '0.6';

    var icon = document.createElement('span');
    icon.textContent = _statusIcons[item.status] || '\u25CB';
    icon.style.cssText = 'width:14px;text-align:center;font-size:11px;flex-shrink:0;color:' + (_statusColors[item.status] || '#64748b') + ';';
    row.appendChild(icon);

    var agent = document.createElement('span');
    agent.textContent = item.agent;
    var ac = _agentColors[item.agent] || '#64748b';
    agent.style.cssText = 'font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:' + ac + '22;color:' + ac + ';min-width:65px;flex-shrink:0;';
    row.appendChild(agent);

    var skill = document.createElement('span');
    skill.textContent = item.type;
    skill.style.cssText = 'font-size:11px;color:var(--foreground);min-width:80px;flex-shrink:0;';
    row.appendChild(skill);

    if (item.classification === 'ingest') {
      var cls = document.createElement('span');
      cls.textContent = 'ingest';
      cls.style.cssText = 'font-size:9px;padding:1px 4px;border-radius:2px;background:#f59e0b22;color:#f59e0b;flex-shrink:0;';
      row.appendChild(cls);
    }

    var tid = document.createElement('span');
    tid.textContent = '#' + item.id;
    tid.style.cssText = 'font-size:10px;color:var(--muted-foreground);font-family:monospace;flex-shrink:0;';
    row.appendChild(tid);

    // ── Configurable columns ──
    var pillCss = 'font-size:9px;padding:1px 5px;border-radius:3px;flex-shrink:0;';

    if (prefs.model && item.model) {
      var m = document.createElement('span');
      var mLabel = item.model.length > 12 ? item.model.substring(0, 12) : item.model;
      m.textContent = mLabel;
      var provColor = item.provider === 'local' ? '#06b6d4' : item.provider === 'claude' ? '#8b5cf6' : '#f59e0b';
      m.style.cssText = pillCss + 'background:' + provColor + '18;color:' + provColor + ';';
      row.appendChild(m);
    }

    if (prefs.duration && item.duration_s != null) {
      var d = document.createElement('span');
      d.textContent = item.duration_s + 's';
      d.style.cssText = pillCss + 'color:var(--muted-foreground);';
      row.appendChild(d);
    }

    if (prefs.tokens && (item.in_tokens || item.out_tokens)) {
      var tk = document.createElement('span');
      tk.textContent = item.in_tokens + '\u2192' + item.out_tokens;
      tk.style.cssText = pillCss + 'color:var(--muted-foreground);font-family:monospace;';
      row.appendChild(tk);
    }

    if (prefs.speed && item.tok_per_sec) {
      var sp = document.createElement('span');
      sp.textContent = item.tok_per_sec + ' t/s';
      sp.style.cssText = pillCss + 'color:var(--muted-foreground);';
      row.appendChild(sp);
    }

    if (prefs.iq && item.iq_score != null) {
      var iq = document.createElement('span');
      var iqColor = item.iq_score >= 0.7 ? '#10b981' : item.iq_score >= 0.4 ? '#f59e0b' : '#ef4444';
      iq.textContent = item.iq_score.toFixed(1);
      iq.style.cssText = pillCss + 'background:' + iqColor + '22;color:' + iqColor + ';font-weight:600;';
      iq.title = 'Intelligence Score';
      row.appendChild(iq);
    }

    if (prefs.cost && item.cost_usd > 0) {
      var c = document.createElement('span');
      c.textContent = '$' + item.cost_usd.toFixed(4);
      c.style.cssText = pillCss + 'color:#ec4899;';
      row.appendChild(c);
    }

    if (prefs.trace && item.trace_id) {
      var tr = document.createElement('span');
      tr.textContent = item.trace_id.substring(0, 8);
      tr.style.cssText = pillCss + 'color:var(--muted-foreground);font-family:monospace;font-size:8px;';
      row.appendChild(tr);
    }

    // ── Right side: error or time ──
    var detail = document.createElement('span');
    detail.style.cssText = 'margin-left:auto;font-size:10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0;';
    if (item.status === 'FAILED' && item.error) {
      detail.textContent = item.error;
      detail.style.color = 'var(--danger)';
    } else {
      detail.textContent = timeAgo(item.created_at);
      detail.style.color = 'var(--muted-foreground)';
    }
    row.appendChild(detail);
    feed.appendChild(row);
  });
}

function loadLiveActivity() {
  apiFetch('/api/activity/live').then(function(d) {
    _renderLiveItems(d.items || []);
  }).catch(function() {});
}

/* ── Activity Graph View ─────────────────────────────────────────────────── */
var _activityCy = null;
var _activityViewMode = 'list';

function toggleActivityView(mode) {
  _activityViewMode = mode;
  var feedEl = document.getElementById('live-activity-feed');
  var graphEl = document.getElementById('live-activity-graph');
  var btnList = document.getElementById('activity-view-list');
  var btnGraph = document.getElementById('activity-view-graph');
  if (mode === 'graph') {
    feedEl.style.display = 'none';
    graphEl.style.display = 'block';
    btnList.className = 'btn btn-sm btn-outline';
    btnGraph.className = 'btn btn-sm btn-primary';
    loadActivityGraph();
  } else {
    feedEl.style.display = '';
    graphEl.style.display = 'none';
    btnList.className = 'btn btn-sm btn-primary';
    btnGraph.className = 'btn btn-sm btn-outline';
    loadLiveActivity();
  }
}

function refreshActivityView() {
  if (_activityViewMode === 'graph') { loadActivityGraph(); }
  else { loadLiveActivity(); }
}

function loadActivityGraph() {
  var container = document.getElementById('live-activity-graph');
  // Destroy previous instance
  if (_activityCy) { try { _activityCy.destroy(); } catch(e){} _activityCy = null; }
  container.textContent = '';

  apiFetch('/api/activity/live').then(function(d) {
    var items = d.items || [];
    var nodes = [];
    var edges = [];
    var nodeIds = {};
    var agentTaskCounts = {};
    var skillTaskCounts = {};
    var agentSkillPairs = {};
    var runningPairs = {};

    // Collect agent and skill nodes from activity items
    items.forEach(function(item) {
      var agentName = item.agent || 'unassigned';
      var skillName = item.type || 'unknown';
      agentTaskCounts[agentName] = (agentTaskCounts[agentName] || 0) + 1;
      skillTaskCounts[skillName] = (skillTaskCounts[skillName] || 0) + 1;
      var pairKey = agentName + '|' + skillName;
      agentSkillPairs[pairKey] = true;
      if (item.status === 'RUNNING') { runningPairs[pairKey] = true; }
    });

    var agentColorMap = {
      researcher: '#3b82f6', coder_1: '#f59e0b', coder_2: '#f59e0b', coder_3: '#f59e0b',
      archivist: '#8b5cf6', planner: '#06b6d4', security: '#ef4444', analyst: '#10b981',
      dr_ders: '#059669', supervisor: '#059669'
    };

    // Center node: model
    nodes.push({ data: { id: 'model-center', label: 'qwen3:8b', nodeType: 'model', taskCount: items.length }, classes: 'model-node' });
    nodeIds['model-center'] = true;

    // Agent nodes (inner ring)
    Object.keys(agentTaskCounts).forEach(function(agent) {
      if (agent === 'unassigned') return;
      var aid = 'agent-' + agent;
      if (nodeIds[aid]) return;
      nodeIds[aid] = true;
      nodes.push({ data: { id: aid, label: agent, nodeType: 'agent', taskCount: agentTaskCounts[agent], color: agentColorMap[agent] || '#64748b' }, classes: 'agent-node' });
      // Edge from model to agent
      edges.push({ data: { source: 'model-center', target: aid, edgeType: 'model-agent' } });
    });

    // Skill nodes (outer ring)
    Object.keys(skillTaskCounts).forEach(function(skill) {
      var sid = 'skill-' + skill;
      if (nodeIds[sid]) return;
      nodeIds[sid] = true;
      nodes.push({ data: { id: sid, label: skill, nodeType: 'skill', taskCount: skillTaskCounts[skill] }, classes: 'skill-node' });
    });

    // Edges from agent to skill
    Object.keys(agentSkillPairs).forEach(function(pairKey) {
      var parts = pairKey.split('|');
      var agentId = 'agent-' + parts[0];
      var skillId = 'skill-' + parts[1];
      if (!nodeIds[agentId] || !nodeIds[skillId]) return;
      var isRunning = runningPairs[pairKey] || false;
      edges.push({ data: { source: agentId, target: skillId, edgeType: isRunning ? 'running' : 'idle' }, classes: isRunning ? 'edge-running' : '' });
    });

    if (nodes.length <= 1) {
      var emptyMsg = document.createElement('div');
      emptyMsg.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted-foreground);font-size:12px;';
      emptyMsg.textContent = 'No recent activity to graph';
      container.appendChild(emptyMsg);
      return;
    }

    _activityCy = cytoscape({
      container: container,
      elements: { nodes: nodes, edges: edges },
      style: [
        { selector: 'node.model-node', style: {
          'label': 'data(label)',
          'background-color': '#8b5cf6',
          'color': isDark() ? '#e2e8f0' : '#1e293b',
          'text-valign': 'bottom', 'text-margin-y': 6,
          'font-size': 11, 'font-weight': 'bold',
          'width': 40, 'height': 40,
          'shape': 'diamond',
          'border-width': 3, 'border-color': '#a78bfa',
        }},
        { selector: 'node.agent-node', style: {
          'label': 'data(label)',
          'background-color': 'data(color)',
          'color': isDark() ? '#e2e8f0' : '#1e293b',
          'text-valign': 'bottom', 'text-margin-y': 4,
          'font-size': 9, 'font-weight': '600',
          'width': function(ele) { return 18 + Math.min(ele.data('taskCount') || 0, 10) * 2.5; },
          'height': function(ele) { return 18 + Math.min(ele.data('taskCount') || 0, 10) * 2.5; },
          'shape': 'ellipse',
          'border-width': 2, 'border-color': 'data(color)',
        }},
        { selector: 'node.skill-node', style: {
          'label': 'data(label)',
          'background-color': isDark() ? '#334155' : '#e2e8f0',
          'color': isDark() ? '#94a3b8' : '#475569',
          'text-valign': 'bottom', 'text-margin-y': 4,
          'font-size': 8,
          'width': function(ele) { return 14 + Math.min(ele.data('taskCount') || 0, 10) * 2; },
          'height': function(ele) { return 14 + Math.min(ele.data('taskCount') || 0, 10) * 2; },
          'shape': 'round-rectangle',
          'border-width': 1, 'border-color': isDark() ? '#475569' : '#cbd5e1',
        }},
        { selector: 'edge', style: {
          'width': 1.5,
          'line-color': isDark() ? '#334155' : '#d1d5db',
          'curve-style': 'bezier',
          'opacity': 0.5,
          'target-arrow-shape': 'triangle',
          'target-arrow-color': isDark() ? '#334155' : '#d1d5db',
          'arrow-scale': 0.6,
        }},
        { selector: 'edge[edgeType="model-agent"]', style: {
          'line-style': 'dotted',
          'opacity': 0.3,
          'width': 1,
        }},
        { selector: 'edge.edge-running', style: {
          'width': 2.5,
          'line-color': '#3b82f6',
          'target-arrow-color': '#3b82f6',
          'opacity': 1,
        }},
      ],
      layout: {
        name: 'concentric',
        concentric: function(node) {
          var t = node.data('nodeType');
          if (t === 'model') return 30;
          if (t === 'agent') return 20;
          return 10;
        },
        levelWidth: function() { return 10; },
        animate: false,
        padding: 20,
        minNodeSpacing: 30,
      },
      userZoomingEnabled: true,
      userPanningEnabled: true,
      boxSelectionEnabled: false,
    });

    // Animate running edges with a pulse effect
    function pulseRunningEdges() {
      if (!_activityCy) return;
      var runEdges = _activityCy.edges('.edge-running');
      if (runEdges.length === 0) return;
      runEdges.animate({ style: { opacity: 0.3 } }, { duration: 600, complete: function() {
        if (!_activityCy) return;
        runEdges.animate({ style: { opacity: 1 } }, { duration: 600, complete: function() {
          if (_activityCy && _activityViewMode === 'graph') pulseRunningEdges();
        }});
      }});
    }
    pulseRunningEdges();

  }).catch(function(err) {
    container.textContent = '';
    var errMsg = document.createElement('div');
    errMsg.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:var(--danger);font-size:12px;';
    errMsg.textContent = 'Failed to load activity graph';
    container.appendChild(errMsg);
  });
}

function loadDashStatus() {
  apiFetch('/api/health').then(function(d) {
    var ollamaEl = document.getElementById('badge-ollama');
    var dbEl = document.getElementById('badge-db');
    if (d.subsystems && d.subsystems.ollama) {
      ollamaEl.textContent = 'Ollama: ' + (d.subsystems.ollama.status || '--');
      ollamaEl.className = 'badge ' + (d.subsystems.ollama.status === 'ok' ? 'badge-success' : 'badge-danger');
    }
    if (d.subsystems && d.subsystems.fleet_db) {
      dbEl.textContent = 'DB: ' + (d.subsystems.fleet_db.status || '--');
      dbEl.className = 'badge ' + (d.subsystems.fleet_db.status === 'ok' ? 'badge-success' : 'badge-danger');
    }
    if (d.uptime_secs) {
      var h = Math.floor(d.uptime_secs / 3600);
      var m = Math.floor((d.uptime_secs % 3600) / 60);
      document.getElementById('header-uptime').textContent = h + 'h ' + m + 'm uptime';
    }
  }).catch(function() {});

  apiFetch('/api/status').then(function(d) {
    var agentCount = d.agents ? d.agents.length : 0;
    document.getElementById('badge-agents').textContent = agentCount + ' Agent' + (agentCount !== 1 ? 's' : '');
    document.getElementById('metric-active-units').textContent = String(agentCount);
    var busy = d.agents ? d.agents.filter(function(a) { return a.status === 'BUSY'; }).length : 0;
    var trendEl = document.getElementById('metric-active-trend');
    trendEl.textContent = busy + ' busy';
    trendEl.className = 'card-trend ' + (busy > 0 ? 'up' : 'neutral');

    var pending = d.tasks ? (d.tasks.PENDING || 0) : 0;
    var running = d.tasks ? (d.tasks.RUNNING || 0) : 0;
    var done = d.tasks ? (d.tasks.DONE || 0) : 0;
    var failed = d.tasks ? (d.tasks.FAILED || 0) : 0;
    document.getElementById('metric-total-requests').textContent = done.toLocaleString();
    var reqTrend = document.getElementById('metric-requests-trend');
    reqTrend.textContent = pending + ' queued \u00B7 ' + running + ' running \u00B7 ' + failed + ' failed';
    reqTrend.className = 'card-trend ' + (running > 0 ? 'up' : pending > 0 ? 'neutral' : 'neutral');
  }).catch(function() {});
}

function loadThermal() {
  apiFetch('/api/thermal').then(function(d) {
    var cpuV = d.cpu_temp_c;
    var cpuEl = document.getElementById('thermal-cpu');
    if (cpuV != null && cpuV > 0) {
      cpuEl.textContent = cpuV + '\u00B0C';
      cpuEl.className = 'thermal-value ' + thermalColor(cpuV, d.thresholds ? d.thresholds.cpu_sustained : 80);
    } else {
      cpuEl.textContent = 'N/A';
      cpuEl.className = 'thermal-value cool';
    }
    var cpuBar = document.getElementById('thermal-cpu-bar');
    var cpuBarVal = (cpuV != null && cpuV > 0) ? cpuV : 0;
    cpuBar.style.width = Math.min(100, Math.round(cpuBarVal)) + '%';
    cpuBar.style.background = cpuBarVal > 0 ? barColor(cpuBarVal, d.thresholds ? d.thresholds.cpu_sustained : 80) : 'var(--muted)';

    var gpuV = d.gpu_temp_c || 0;
    var gpuEl = document.getElementById('thermal-gpu');
    gpuEl.textContent = gpuV + '\u00B0C';
    gpuEl.className = 'thermal-value ' + thermalColor(gpuV, d.thresholds ? d.thresholds.gpu_burst : 78);
    var gpuBar = document.getElementById('thermal-gpu-bar');
    gpuBar.style.width = Math.min(100, Math.round(gpuV)) + '%';
    gpuBar.style.background = barColor(gpuV, d.thresholds ? d.thresholds.gpu_burst : 78);

    var memPct = d.system ? d.system.ram_pct : 0;
    var memEl = document.getElementById('thermal-memory');
    memEl.textContent = memPct + '%';
    memEl.className = 'thermal-value ' + thermalColor(memPct, 100);
    var memBar = document.getElementById('thermal-mem-bar');
    memBar.style.width = memPct + '%';
    memBar.style.background = barColor(memPct, 100);

    var cpuPctLoad = d.system ? d.system.cpu_pct : 0;
    document.getElementById('metric-system-load').textContent = cpuPctLoad + '%';
    document.getElementById('metric-load-trend').textContent = (d.system ? d.system.cpu_cores : '?') + ' cores';
  }).catch(function() {});
}

/* ── Neural Lane Graph ──────────────────────────────────────────────────── */
var _neuralAnim = null;
var _neuralData = null;
var _neuralPulses = [];

function loadNeuralLanes() {
  apiFetch('/api/activity/lanes?hours=24').then(function(data) {
    _neuralData = data;
    _neuralPulses = [];
    // Show Factorio legend dot when lane present
    var fLeg = document.getElementById('factorio-legend');
    if (fLeg) {
      var hasF = (data.lanes || []).some(function(l) { return l.kind === 'factorio'; });
      fLeg.style.display = hasF ? '' : 'none';
    }
    // Seed initial pulses from timeline
    if (data.timeline) {
      data.timeline.forEach(function(t, i) {
        _neuralPulses.push({
          agent: t.agent, skill: t.skill, status: t.status,
          x: 0.3 + Math.random() * 0.6, alpha: 0.3 + Math.random() * 0.5,
          speed: 0.002 + Math.random() * 0.003, size: 3 + Math.random() * 4
        });
      });
    }
    if (!_neuralAnim) {
      _neuralAnim = requestAnimationFrame(renderNeuralFrame);
    }
  }).catch(function() {});
}

function renderNeuralFrame() {
  if (document.hidden) { _neuralAnim = null; return; }
  var canvas = document.getElementById('neural-lane-canvas');
  if (!canvas || !_neuralData) { _neuralAnim = null; return; }
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  var w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);

  var lanes = _neuralData.lanes || [];
  var skills = _neuralData.skills || [];
  var folders = _neuralData.folders || [];
  var channels = _neuralData.channels || [];
  var edges = _neuralData.edges || [];

  if (lanes.length === 0 && skills.length === 0) {
    ctx.fillStyle = 'rgba(148,163,184,0.5)';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No activity in last 24h', w / 2, h / 2);
    _neuralAnim = null; return;
  }

  // Layout: left labels | bars | right sidebar (skills/folders)
  var labelW = 85, barStart = labelW + 8, sideW = 110;
  var barW = w - barStart - sideW - 10;
  var maxLanes = Math.min(lanes.length, 12);
  var laneH = Math.min(24, (h - 30) / Math.max(maxLanes, 1));
  var laneGap = 3;
  var topOff = 12;
  // Scale agents and models independently so model token counts don't crush agent bars
  var agentLanes = lanes.filter(function(l) { return l.kind !== 'model'; });
  var modelLanes = lanes.filter(function(l) { return l.kind === 'model'; });
  var maxAgentTotal = Math.max.apply(null, agentLanes.map(function(l) { return l.total; }).concat([1]));
  var maxModelTotal = Math.max.apply(null, modelLanes.map(function(l) { return l.total; }).concat([1]));

  // Kind colors
  var kindColor = { agent: '#10b981', model: '#a78bfa', factorio: '#f97316' };
  var statusColor = { done: '#10b981', failed: '#ef4444', running: '#3b82f6' };

  // ── DRAW LANES ──────────────────────────────────────────────────
  var laneMap = {};
  for (var i = 0; i < maxLanes; i++) {
    var lane = lanes[i];
    var y = topOff + i * (laneH + laneGap);
    var kc = kindColor[lane.kind] || '#64748b';

    // Kind indicator dot
    ctx.fillStyle = kc;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(labelW + 2, y + laneH / 2, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Lane track
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.beginPath();
    ctx.roundRect(barStart, y, barW, laneH, 3);
    ctx.fill();

    // Stacked bar segments — scale against own kind's max
    var laneMax = lane.kind === 'model' ? maxModelTotal : maxAgentTotal;
    var scale = barW / laneMax;
    var cx = barStart;
    [{ v: lane.done, c: statusColor.done },
     { v: lane.failed, c: statusColor.failed },
     { v: lane.running, c: statusColor.running }].forEach(function(seg) {
      if (seg.v <= 0) return;
      var segW = Math.max(seg.v * scale, 2);
      ctx.globalAlpha = 0.65;
      ctx.fillStyle = seg.c;
      ctx.beginPath();
      ctx.roundRect(cx, y + 2, segW, laneH - 4, 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      cx += segW;
    });

    // Label
    var isActive = lane.running > 0;
    ctx.fillStyle = isActive ? '#e2e8f0' : '#94a3b8';
    ctx.font = (isActive ? 'bold ' : '') + '10px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    var label = lane.agent.length > 12 ? lane.agent.slice(0, 11) + '\u2026' : lane.agent;
    ctx.fillText(label, labelW - 4, y + laneH / 2);

    // Count + tokens badge — always right-aligned inside the track
    var badge = lane.total + '';
    if (lane.tokens) badge += '  ' + Math.round(lane.tokens / 1000) + 'k tok';
    if (lane.cost) badge += '  $' + lane.cost;
    ctx.font = '9px system-ui, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(badge, barStart + barW - 5, y + laneH / 2);

    lane._y = y;
    lane._laneH = laneH;
    laneMap[lane.agent] = i;
  }

  // ── NEURAL EDGES (bezier curves between lanes sharing skills) ───
  ctx.globalAlpha = 0.1;
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 1;
  edges.forEach(function(e) {
    var si = laneMap[e.source], ti = laneMap[e.target];
    if (si === undefined || ti === undefined) return;
    var sy = topOff + si * (laneH + laneGap) + laneH / 2;
    var ty = topOff + ti * (laneH + laneGap) + laneH / 2;
    var mx = barStart - 12;
    ctx.beginPath();
    ctx.moveTo(barStart, sy);
    ctx.bezierCurveTo(mx, sy, mx, ty, barStart, ty);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // ── RIGHT SIDEBAR: scrollable panel ──────────────────────────────
  var sideX = barStart + barW + 12;
  var sideTop = topOff;
  var sideBottom = h - 4;
  var sideAvail = sideBottom - sideTop;

  // Build sidebar items into virtual list, then render with scroll
  var sideItems = [];
  // Skills section
  if (skills.length > 0) {
    sideItems.push({ type: 'header', text: 'TOP SKILLS', color: '#f59e0b' });
    skills.forEach(function(sk) {
      sideItems.push({ type: 'skill', skill: sk });
    });
  }
  // Knowledge
  if (folders.length > 0) {
    sideItems.push({ type: 'header', text: 'KNOWLEDGE', color: '#06b6d4' });
    folders.forEach(function(fo) {
      sideItems.push({ type: 'folder', folder: fo });
    });
  }
  // Channels
  if (channels.length > 0) {
    sideItems.push({ type: 'header', text: 'CHANNELS', color: '#818cf8' });
    channels.forEach(function(ch) {
      sideItems.push({ type: 'channel', channel: ch });
    });
  }

  // Compute total content height
  var itemH = { header: 16, skill: 14, folder: 13, channel: 13 };
  var totalSideH = 0;
  sideItems.forEach(function(it) { totalSideH += itemH[it.type] || 13; });

  // Scroll state (mouse wheel on canvas)
  if (!window._neuralSideScroll) window._neuralSideScroll = 0;
  var maxScroll = Math.max(0, totalSideH - sideAvail);
  window._neuralSideScroll = Math.max(0, Math.min(window._neuralSideScroll, maxScroll));
  var scrollY = window._neuralSideScroll;

  // Clip sidebar region
  ctx.save();
  ctx.beginPath();
  ctx.rect(sideX - 2, sideTop - 2, sideW + 4, sideAvail + 4);
  ctx.clip();

  var sy = sideTop - scrollY;
  sideItems.forEach(function(it) {
    var ih = itemH[it.type] || 13;
    // Skip items fully above or below viewport
    if (sy + ih < sideTop - 2 || sy > sideBottom + 2) { sy += ih; return; }

    if (it.type === 'header') {
      sy += 4;
      ctx.fillStyle = it.color;
      ctx.font = 'bold 9px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(it.text, sideX, sy + 4);
      sy += ih - 4;
    } else if (it.type === 'skill') {
      var sk = it.skill;
      var skName = sk.skill.length > 13 ? sk.skill.slice(0, 12) + '\u2026' : sk.skill;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '9px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(skName, sideX, sy + 4);
      var skBarW = 40;
      var skFill = Math.max(2, (sk.done / (sk.total || 1)) * skBarW);
      ctx.fillStyle = 'rgba(245,158,11,0.15)';
      ctx.fillRect(sideX + 70, sy - 2, skBarW, 10);
      ctx.fillStyle = sk.failed > 0 ? '#ef4444' : '#f59e0b';
      ctx.globalAlpha = 0.7;
      ctx.fillRect(sideX + 70, sy - 2, skFill, 10);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#64748b';
      ctx.font = '8px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(sk.total + '', sideX + 70 + skBarW + 14, sy + 4);
      ctx.textAlign = 'left';
      sy += ih;
    } else if (it.type === 'folder') {
      var fo = it.folder;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '9px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(fo.name.length > 11 ? fo.name.slice(0, 10) + '\u2026' : fo.name, sideX, sy + 4);
      ctx.fillStyle = '#64748b';
      ctx.font = '8px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(fo.files + ' files', sideX + sideW - 8, sy + 4);
      ctx.textAlign = 'left';
      sy += ih;
    } else if (it.type === 'channel') {
      var ch = it.channel;
      ctx.fillStyle = '#94a3b8';
      ctx.font = '9px system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('#' + ch.channel, sideX, sy + 4);
      ctx.fillStyle = '#64748b';
      ctx.font = '8px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(ch.count + ' msgs', sideX + sideW - 8, sy + 4);
      ctx.textAlign = 'left';
      sy += ih;
    }
  });

  ctx.restore();

  // Scroll indicator (thin track on right edge if content overflows)
  if (maxScroll > 0) {
    var trackX = sideX + sideW + 1;
    var thumbH = Math.max(12, (sideAvail / totalSideH) * sideAvail);
    var thumbY = sideTop + (scrollY / maxScroll) * (sideAvail - thumbH);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(trackX, sideTop, 3, sideAvail);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.roundRect(trackX, thumbY, 3, thumbH, 1.5);
    ctx.fill();
  }

  // ── MODEL PULSE INDICATOR: glowing ring on model lanes during active inference ──
  var activeModels = window._neuralActiveModels || {};
  if (Object.keys(activeModels).length > 0) {
    var pulseClock = (Date.now() / 600) % (Math.PI * 2);
    var pulseAlpha = 0.35 + Math.sin(pulseClock) * 0.25;
    for (var ai = 0; ai < maxLanes; ai++) {
      var aLane = lanes[ai];
      if (aLane.kind !== 'model') continue;
      var modelKey = aLane.agent;
      if (!activeModels[modelKey]) continue;
      var mly = aLane._y + aLane._laneH / 2;
      var ringX = barStart + barW - 8;
      ctx.globalAlpha = pulseAlpha;
      ctx.strokeStyle = '#a78bfa';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ringX, mly, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = pulseAlpha * 0.4;
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath();
      ctx.arc(ringX, mly, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // ── ANIMATED PULSES ─────────────────────────────────────────────
  _neuralPulses.forEach(function(p) {
    var li = laneMap[p.agent];
    if (li === undefined) return;
    var lane = lanes[li];
    var py = lane._y + lane._laneH / 2;
    // Clamp px so pulses never render outside the bar area
    var px = barStart + Math.max(0, Math.min(1, p.x)) * barW;
    var col = statusColor[p.status.toLowerCase()] || statusColor.done;

    // Glow
    ctx.globalAlpha = p.alpha * 0.35;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(px, py, p.size * 2.5, 0, Math.PI * 2);
    ctx.fill();
    // Core
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(px, py, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Advance
    p.x += p.speed;
    p.alpha -= 0.002;
    if (p.x > 1.1 || p.alpha <= 0) {
      p.alpha = 0;  // mark for removal — real pulses come from SSE now
    }
  });

  // Remove dead pulses
  _neuralPulses = _neuralPulses.filter(function(p) { return p.alpha > 0; });

  _neuralAnim = requestAnimationFrame(renderNeuralFrame);
}

// Wire mouse wheel scrolling on the neural lane canvas sidebar
(function() {
  var c = document.getElementById('neural-lane-canvas');
  if (c) c.addEventListener('wheel', function(e) {
    if (!window._neuralSideScroll && window._neuralSideScroll !== 0) return;
    window._neuralSideScroll = (window._neuralSideScroll || 0) + e.deltaY * 0.5;
    if (window._neuralSideScroll < 0) window._neuralSideScroll = 0;
    e.preventDefault();
  }, { passive: false });
})();

}

function loadDashSettings() {
  apiFetch('/api/settings').then(function(d) {
    var el = document.getElementById('dash-settings-list');
    if (!d.settings) { el.textContent = 'No settings available'; return; }
    var container = document.createElement('div');
    container.style.cssText = 'display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px';
    var keys = ['fleet', 'models', 'thermal', 'dashboard', 'workers'];
    keys.forEach(function(section) {
      if (!d.settings[section]) return;
      var vals = d.settings[section].values || {};
      var box = document.createElement('div');
      box.style.cssText = 'background:var(--muted);border-radius:8px;padding:12px;overflow:hidden;min-width:0';
      var title = document.createElement('div');
      title.style.cssText = 'font-weight:600;color:var(--foreground);margin-bottom:6px;font-size:12px;text-transform:uppercase';
      title.textContent = section;
      box.appendChild(title);
      var vkeys = Object.keys(vals).slice(0, 5);
      vkeys.forEach(function(k) {
        var v = vals[k];
        if (typeof v === 'boolean') v = v ? 'On' : 'Off';
        if (typeof v === 'object') v = JSON.stringify(v);
        var vStr = String(v);
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2px 0;min-width:0';
        var lbl = document.createElement('span');
        lbl.style.cssText = 'flex-shrink:0;white-space:nowrap';
        lbl.textContent = k;
        var val = document.createElement('span');
        val.style.cssText = 'color:var(--foreground);font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0';
        val.textContent = vStr;
        val.title = vStr;  // full value on hover
        row.appendChild(lbl);
        row.appendChild(val);
        box.appendChild(row);
      });
      container.appendChild(box);
    });
    el.textContent = '';
    el.appendChild(container);
  }).catch(function() {
    document.getElementById('dash-settings-list').textContent = 'Failed to load settings';
  });
}

function formatUptime(seconds) {
  if (!seconds || seconds <= 0) return '';
  if (seconds < 60) return seconds + 's';
  if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
  if (seconds < 86400) return Math.floor(seconds / 3600) + 'h ' + Math.floor((seconds % 3600) / 60) + 'm';
  return Math.floor(seconds / 86400) + 'd ' + Math.floor((seconds % 86400) / 3600) + 'h';
}

function loadKanban() {
  Promise.all([
    apiFetch('/api/queue'),
    apiFetch('/api/tasks/recent?limit=20')
  ]).then(function(results) {
    var d = results[0];
    var recent = results[1];
    var cols = { RUNNING: [], PENDING: [], WAITING_HUMAN: [], DONE: [], FAILED: [] };
    // Queue gives us pending/running
    (d.tasks || []).forEach(function(t) {
      var s = t.status || 'PENDING';
      if (!cols[s]) cols[s] = [];
      cols[s].push(t);
    });
    // Recent gives us done/failed
    ((recent && recent.tasks) || []).forEach(function(t) {
      var s = t.status || '';
      if ((s === 'DONE' || s === 'FAILED') && cols[s]) {
        cols[s].push(t);
      }
    });
    var el = document.getElementById('kanban-container');
    el.textContent = '';
    ['RUNNING', 'PENDING', 'WAITING_HUMAN', 'DONE', 'FAILED'].forEach(function(st) {
      var tasks = cols[st] || [];
      var col = document.createElement('div');
      col.className = 'kanban-column';

      var titleDiv = document.createElement('div');
      titleDiv.className = 'kanban-column-title';
      titleDiv.textContent = st + ' ';
      var countSpan = document.createElement('span');
      countSpan.className = 'kanban-column-count';
      countSpan.textContent = String(tasks.length);
      titleDiv.appendChild(countSpan);
      col.appendChild(titleDiv);

      if (tasks.length === 0) {
        var emptyMsg = document.createElement('div');
        emptyMsg.style.cssText = 'text-align:center;color:var(--muted-foreground);font-size:12px;padding:16px';
        emptyMsg.textContent = 'Empty';

        card.appendChild(typeDiv);
        card.appendChild(metaDiv);
        col.appendChild(card);
      });
      el.appendChild(col);
    });
  }).catch(function() {});
}

function loadSwimlane() {
  apiFetch('/api/tasks/recent?limit=50').then(function(data) {
    var tasks = data.tasks || data;
    if (!Array.isArray(tasks)) tasks = [];
    var el = document.getElementById('swimlane-container');
    el.textContent = '';
    if (tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var icon = document.createElement('div');
      icon.className = 'empty-icon';
      icon.textContent = '\u21C4';
      var title = document.createElement('div');
      title.className = 'empty-title';
      title.textContent = 'No recent tasks for swimlane';
      empty.appendChild(icon);
      empty.appendChild(title);
      el.appendChild(empty);
      return;
    }

    // Parse timestamps and determine time range
    var now = Date.now();
    tasks.forEach(function(t) {
      t._ts = t.created_at ? new Date(t.created_at).getTime() : now;
    });
    var minTs = Math.min.apply(null, tasks.map(function(t) { return t._ts; }));
    var maxTs = now; // anchor right edge to present so timeline always shows "now"
    var range = Math.max(maxTs - minTs, 60000); // at least 1 minute range
    var trackWidth = 600; // pixels

    // Group tasks by agent
    var laneMap = {};
    var laneOrder = [];
    tasks.forEach(function(t) {
      var agent = t.assigned_to || t.agent || 'unassigned';
      if (!laneMap[agent]) { laneMap[agent] = []; laneOrder.push(agent); }
      laneMap[agent].push(t);
    });

    // Build time header
    var timeHeader = document.createElement('div');
    timeHeader.className = 'swimlane-time-header';
    timeHeader.style.minWidth = (100 + trackWidth) + 'px';
    var tickCount = 6;
    for (var ti = 0; ti <= tickCount; ti++) {
      var tickTs = minTs + (range * ti / tickCount);
      var tickAgo = Math.floor((now - tickTs) / 1000);
      var tickLabel = '';
      if (tickAgo < 60) tickLabel = tickAgo + 's ago';
      else if (tickAgo < 3600) tickLabel = Math.floor(tickAgo / 60) + 'm ago';
      else if (tickAgo < 86400) tickLabel = Math.floor(tickAgo / 3600) + 'h ago';
      else tickLabel = Math.floor(tickAgo / 86400) + 'd ago';
      var tickSpan = document.createElement('span');
      tickSpan.textContent = tickLabel;
      tickSpan.style.left = Math.round((ti / tickCount) * trackWidth) + 'px';
      timeHeader.appendChild(tickSpan);
    }
    el.appendChild(timeHeader);

    // Status colors
    var statusColors = { DONE: '#10b981', RUNNING: '#3b82f6', PENDING: '#f59e0b', FAILED: '#ef4444' };

    // Build lanes
    laneOrder.forEach(function(agent, laneIdx) {
      var lane = document.createElement('div');
      lane.className = 'swimlane-lane ' + (laneIdx % 2 === 0 ? 'lane-even' : 'lane-odd');
      lane.style.minWidth = (100 + trackWidth) + 'px';

      var label = document.createElement('div');
      label.className = 'swimlane-label';
      label.textContent = agent.length > 12 ? agent.slice(0, 11) + '\u2026' : agent;
      label.title = agent;

      var track = document.createElement('div');
      track.className = 'swimlane-track';
      track.style.width = trackWidth + 'px';

      var agentTasks = laneMap[agent];
      agentTasks.forEach(function(t) {
        var xPos = Math.round(((t._ts - minTs) / range) * (trackWidth - 60));
        var status = (t.status || 'PENDING').toUpperCase();
        var color = statusColors[status] || '#64748b';
        var taskType = t.type || t.skill || 'task';
        var taskBox = document.createElement('div');
        taskBox.className = 'swimlane-task';
        taskBox.style.left = xPos + 'px';
        taskBox.style.width = '56px';
        taskBox.style.background = color;
        taskBox.textContent = taskType.length > 8 ? taskType.slice(0, 7) + '\u2026' : taskType;
        taskBox.title = taskType + ' (#' + (t.id || '?') + ') - ' + status;
        track.appendChild(taskBox);
      });

      lane.appendChild(label);
      lane.appendChild(track);
      el.appendChild(lane);
    });
  }).catch(function() {
    // Fallback to agent performance data
    apiFetch('/api/agents/performance').then(function(d) {
      var el = document.getElementById('swimlane-container');
      el.textContent = '';
      if (!d.agents || d.agents.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'empty-state';
        var icon = document.createElement('div');
        icon.className = 'empty-icon';
        icon.textContent = '\u21C4';
        var title = document.createElement('div');
        title.className = 'empty-title';
        title.textContent = 'No recent agent activity';
        empty.appendChild(icon);
        empty.appendChild(title);
        el.appendChild(empty);
        return;
      }
      var msg = document.createElement('div');
      msg.style.cssText = 'color:var(--muted-foreground);text-align:center;padding:16px;font-size:13px';
      msg.textContent = d.agents.length + ' agents active — detailed swimlane requires /api/tasks/recent';
      el.appendChild(msg);
    }).catch(function() {});
  });
}

function loadNeuralGraph() {
  if (typeof cytoscape === 'undefined') {
    var el = document.getElementById('cytoscape-container');
    el.textContent = '';
    var msg = document.createElement('div');

    var t = document.createElement('div');
    t.className = 'empty-title';
    t.textContent = 'Cytoscape.js not loaded';
    msg.appendChild(t);
    el.appendChild(msg);
    return;
  }

  // Universe graph node type colors and sizes (matches view_engine.js NODE_TYPE_COLORS)
  var nodeTypeStyle = {
    hub:        { color: '#3b82f6', size: 44, fontSize: 14, shape: 'ellipse' },
    agent:      { color: '#10b981', size: 36, fontSize: 12, shape: 'ellipse' },

    model:      { color: '#ec4899', size: 32, fontSize: 12, shape: 'ellipse' },
    folder:     { color: '#06b6d4', size: 22, fontSize: 10, shape: 'ellipse' },
    message:    { color: '#6366f1', size: 18, fontSize: 10, shape: 'ellipse' },

    chunk:      { color: '#0ea5e9', size: 16, fontSize: 9, shape: 'ellipse' },
    scorer:     { color: '#f97316', size: 22, fontSize: 10, shape: 'ellipse' },
    trainer:    { color: '#d946ef', size: 22, fontSize: 10, shape: 'ellipse' },
    evaluator:  { color: '#a855f7', size: 22, fontSize: 10, shape: 'ellipse' },
    task_group: { color: '#f59e0b', size: 20, fontSize: 9,  shape: 'round-tag' },
    community:  { color: '#444444', size: 60, fontSize: 11, shape: 'roundrectangle' },
  };
  var defaultStyle = { color: '#64748b', size: 20, fontSize: 10, shape: 'ellipse' };

  /* Register fcose layout extension if available (idempotent) */
  if (!window._graphFcoseRegistered) {
    var hasFcose = typeof cytoscape !== 'undefined' && typeof cytoscapeFcose === 'function';
    if (hasFcose) { try { cytoscape.use(cytoscapeFcose); window._graphFcoseRegistered = true; } catch(e) {} }
  }
  var _hasFcose = !!window._graphFcoseRegistered;

  /* Current layout name — read from dropdown or default */
  if (!window._graphLayoutName) window._graphLayoutName = 'fractal-brain';
  var _graphLayoutName = window._graphLayoutName;

  function _getLayoutConfig(nodeCount) {
    var name = _graphLayoutName;
    if (name === 'fractal-brain') {
      return {
        name: 'fcose',
        quality: nodeCount > 200 ? 'default' : 'proof',
        randomize: true,
        animate: 'end',
        animationDuration: 500,
        fit: true,
        padding: 10,
        nodeRepulsion: function(node) {
          return node.isParent() ? 6000 : 1500;
        },
        idealEdgeLength: function(edge) {
          var src = edge.source(), tgt = edge.target();
          if (src.parent().length && tgt.parent().length && src.parent().id() === tgt.parent().id()) return 12;
          return 50;
        },
        edgeElasticity: 0.2,
        gravity: 1.0,
        gravityRange: 6.0,
        nestingFactor: 0.05,
        numIter: nodeCount > 200 ? 3000 : 6000,
        packComponents: true,
        componentSpacing: 40,
        nodeDimensionsIncludeLabels: false,
      };
    } else if (name === 'concentric') {
      return {
        name: 'concentric', animate: false, padding: 10,
        concentric: function(n) { return n.degree(); },
        levelWidth: function() { return 2; }
      };
    }
    /* fcose (default fallback) */
    if (!_hasFcose) return { name: 'cose', animate: false, padding: 10 };
    return {
      name: 'fcose', animate: false, padding: 10,
      nodeRepulsion: nodeCount > 200 ? 50000 : 30000,
      idealEdgeLength: nodeCount > 200 ? 25 : 18,
      edgeElasticity: 0.2, gravity: 1.2, gravityRange: 2.0,
      numIter: nodeCount > 500 ? 2500 : 5000,
      quality: nodeCount > 500 ? 'default' : 'proof',
      nodeDimensionsIncludeLabels: false, randomize: true,
      packComponents: true, componentSpacing: 20
    };
  }

  window.switchGraphLayout = function(name) {
    window._graphLayoutName = name;
    if (_cyInstance) {
      _cyInstance.layout(_getLayoutConfig(_cyInstance.nodes().length)).run();
    }
  };

  function buildCyGraph(cyNodes, cyEdges) {
    if (_cyInstance) _cyInstance.destroy();
    var nodeCount = cyNodes.length;
    _cyInstance = cytoscape({
      container: document.getElementById('cytoscape-container'),
      minZoom: 0.3,
      maxZoom: 3,
      wheelSensitivity: 0.3,
      elements: { nodes: cyNodes, edges: cyEdges },
      style: [
        {
          selector: 'node',
          style: {
            'background-color': 'data(color)',
            'label': '',
            'color': '#e2e8f0',
            'font-size': 9,
            'text-valign': 'bottom',
            'text-margin-y': 4,
            'width': 10,
            'height': 10,
            'shape': 'data(shape)',
            'border-width': 1,
            'border-color': 'data(color)',
            'text-wrap': 'ellipsis',
            'text-max-width': '90px',
            'transition-property': 'width, height, border-width, opacity',

        },
        {
          selector: 'node.hover-neighbor',
          style: {
            'label': 'data(label)',
            'width': 'data(size)',
            'height': 'data(size)',
            'font-size': 10,
            'border-width': 2,
            'z-index': 10,
          }
        },
        {
          selector: 'node.hover-center',
          style: {
            'label': 'data(label)',
            'width': function(n) { return (n.data('size') || 20) * 1.6; },
            'height': function(n) { return (n.data('size') || 20) * 1.6; },
            'font-size': 12,
            'font-weight': 'bold',
            'border-width': 3,
            'border-color': '#ffffff',
            'z-index': 20,
          }
        },
        {
          selector: 'node.selected-node',
          style: {
            'label': 'data(label)',
            'width': function(n) { return (n.data('size') || 20) * 1.5; },
            'height': function(n) { return (n.data('size') || 20) * 1.5; },
            'font-size': 11,
            'font-weight': 'bold',
            'border-width': 3,
            'border-color': '#fbbf24',
            'z-index': 20,
          }
        },
        {
          selector: 'node.selected-neighbor',
          style: {
            'label': 'data(label)',
            'width': 'data(size)',
            'height': 'data(size)',
            'font-size': 10,
            'border-width': 2,
            'z-index': 10,
          }
        },
        {
          selector: 'node.dimmed',
          style: { 'opacity': 0.15 }
        },
        {
          selector: ':parent',
          style: {
            'background-opacity': 0.04,
            'background-color': 'data(color)',
            'border-width': 1,
            'border-color': 'data(color)',
            'border-opacity': 0.15,
            'border-style': 'dashed',
            'padding': 8,
            'text-valign': 'top',
            'text-halign': 'center',
            'label': 'data(label)',
            'font-size': '11px',
            'color': '#a0a0a0',
            'shape': 'roundrectangle',
          }
        },
        {
          selector: 'node[type="task_group"]',
          style: {
            'width': function(n) { return 8 + Math.sqrt(n.data('count') || 1) * 3; },
            'height': function(n) { return 8 + Math.sqrt(n.data('count') || 1) * 3; },
            'shape': 'round-tag',
          }
        },
        {
          selector: 'edge',
          style: {
            'width': 0.8,
            'line-color': chartBorder(),
            'curve-style': 'bezier',
            'opacity': 0.08,
            'target-arrow-shape': 'triangle',
            'target-arrow-color': chartBorder(),
            'arrow-scale': 0.5,
          }
        },
        {
          selector: 'edge.highlighted',

            'width': 2.5,
            'opacity': 0.8,
            'line-color': '#fbbf24',
            'target-arrow-color': '#fbbf24',
            'z-index': 20,
          }
        },
        {
          selector: 'edge.hover-edge',
          style: {
            'width': 1.5,
            'opacity': 0.5,
            'line-color': 'data(color)',
          }
        },
        {
          selector: 'edge[weight < 2]',
          style: { 'display': 'none' }
        },
        {
          selector: 'edge.dimmed',
          style: { 'opacity': 0.03 }
        },
      ],
      layout: _getLayoutConfig(nodeCount)
    });

    /* ── Lock positions after layout to prevent drift ──────────────── */
    _cyInstance.on('layoutstop', function() {
      _cyInstance.nodes().lock();
    });

    /* ── Hover: highlight neighborhood (no position changes) ────────── */
    var _hoverTimeout;
    _cyInstance.on('mouseover', 'node', function(evt) {
      clearTimeout(_hoverTimeout);
      var node = evt.target;
      node.addClass('hover-center');
      node.neighborhood('node').addClass('hover-neighbor');
      node.connectedEdges().addClass('hover-edge');
      /* Dim non-neighbors for focus */
      _cyInstance.nodes().not(node.neighborhood().add(node)).addClass('dimmed');
      _cyInstance.edges().not(node.connectedEdges()).addClass('dimmed');
