    _cyInstance.on('mouseout', 'node', function(evt) {
      _hoverTimeout = setTimeout(function() {
        _cyInstance.nodes().removeClass('hover-center hover-neighbor dimmed');
        _cyInstance.edges().removeClass('hover-edge dimmed');
      }, 100);
    });

    /* ── Click selection: bold connected edges, show detail ──────────── */
    var _selectedNode = null;
    _cyInstance.on('tap', 'node', function(evt) {
      var node = evt.target;
      _cyInstance.nodes().removeClass('selected-node selected-neighbor dimmed');
      _cyInstance.edges().removeClass('highlighted dimmed');

      if (_selectedNode === node.id()) {
        _selectedNode = null;
        _hideNodeDetail();
        return;
      }
      _selectedNode = node.id();

      var neighborhood = node.neighborhood().add(node);
      node.addClass('selected-node');
      node.neighborhood('node').addClass('selected-neighbor');
      node.connectedEdges().addClass('highlighted');
      _cyInstance.nodes().not(neighborhood).addClass('dimmed');
      _cyInstance.edges().not(node.connectedEdges()).addClass('dimmed');
      _showNodeDetail(node);
    });

    _cyInstance.on('tap', function(evt) {
      if (evt.target === _cyInstance) {
        _cyInstance.nodes().removeClass('selected-node selected-neighbor dimmed');
        _cyInstance.edges().removeClass('highlighted dimmed');
        _selectedNode = null;
        _hideNodeDetail();
      }
    });

    /* ── Node detail overlay (safe DOM — no innerHTML) ────────────────── */
    function _showNodeDetail(node) {
      var el = document.getElementById('graph-node-detail');
      if (!el) {
        el = document.createElement('div');
        el.id = 'graph-node-detail';
        el.style.cssText = 'position:absolute;top:8px;right:8px;background:rgba(15,23,42,0.92);'
          + 'border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px 16px;'
          + 'color:#e2e8f0;font-size:12px;max-width:240px;z-index:30;pointer-events:auto;'
          + 'backdrop-filter:blur(8px);';
        container.appendChild(el);
      }
      el.textContent = '';
      var d = node.data();

      var title = document.createElement('div');
      title.style.cssText = 'font-size:14px;font-weight:bold;margin-bottom:6px;color:' + d.color;
      title.textContent = d.label || d.id;
      el.appendChild(title);

      var typeLbl = document.createElement('div');
      typeLbl.style.cssText = 'color:#94a3b8;margin-bottom:4px';
      typeLbl.textContent = (d.type || 'unknown').toUpperCase();
      el.appendChild(typeLbl);

      var conns = node.neighborhood('node').length;
      var edgeCount = node.connectedEdges().length;
      var statsLbl = document.createElement('div');
      statsLbl.style.marginBottom = '4px';
      statsLbl.textContent = conns + ' connections \u00B7 ' + edgeCount + ' edges';
      el.appendChild(statsLbl);

      var neighbors = node.neighborhood('node');
      if (neighbors.length > 0) {
        var sep = document.createElement('div');
        sep.style.cssText = 'margin-top:6px;border-top:1px solid rgba(255,255,255,0.1);padding-top:6px';
        var shown = Math.min(neighbors.length, 8);
        for (var i = 0; i < shown; i++) {
          var nd = neighbors[i].data();
          var span = document.createElement('span');
          span.style.color = nd.color || '#94a3b8';
          span.textContent = (nd.label || nd.id || '').substring(0, 20);
          sep.appendChild(span);
          if (i < shown - 1) sep.appendChild(document.createTextNode(', '));
        }
        if (neighbors.length > 8) {
          var more = document.createElement('span');
          more.style.color = '#64748b';
          more.textContent = ' +' + (neighbors.length - 8) + ' more';
          sep.appendChild(more);
        }
        el.appendChild(sep);
      }
      el.style.display = 'block';
    }

    function _hideNodeDetail() {
      var el = document.getElementById('graph-node-detail');
      if (el) el.style.display = 'none';
    }

    /* ── SSE-driven graph animations ────────────────────────────────── */
    var _pulseCanvas = document.createElement('canvas');
    _pulseCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10';
    var container = document.getElementById('cytoscape-container');
    container.style.position = 'relative';
    container.appendChild(_pulseCanvas);
    var _pulseCtx = _pulseCanvas.getContext('2d');
    var _particles = [];

    /* Spawn a pulse particle between two nodes by ID */
    window._graphPulse = function(sourceId, targetId, color) {
      if (!_cyInstance || _cyInstance.destroyed()) return;
      var srcNode = _cyInstance.getElementById(sourceId);
      var tgtNode = _cyInstance.getElementById(targetId);
      if (!srcNode.length || !tgtNode.length) return;
      var src = srcNode.renderedPosition();
      var tgt = tgtNode.renderedPosition();
      _particles.push({ sx: src.x, sy: src.y, tx: tgt.x, ty: tgt.y, t: 0,
        color: color || '#10b981', speed: 0.006 + Math.random() * 0.008 });
    };

    /* Pulse a node (agent did something) — brief size + glow bump */
    window._graphNodePulse = function(nodeId, color) {
      if (!_cyInstance || _cyInstance.destroyed()) return;
      var node = _cyInstance.getElementById(nodeId);
      if (!node.length) return;
      var origSize = node.data('size') || 20;
      node.style({ 'width': origSize * 1.8, 'height': origSize * 1.8,
        'border-color': color || '#10b981', 'border-width': 4 });
      setTimeout(function() {
        if (!_cyInstance || _cyInstance.destroyed()) return;
        node.style({ 'width': origSize, 'height': origSize,
          'border-color': node.data('color'), 'border-width': 2 });
      }, 800);
    };

    /* SSE hook — called from handleSSE when live activity arrives */
    window._graphOnActivity = function(liveItems) {
      if (!_cyInstance || _cyInstance.destroyed()) return;
      for (var i = 0; i < liveItems.length; i++) {
        var item = liveItems[i];
        var agent = item.assigned_to || item.agent;
        var skill = item.type || item.skill;
        var status = item.status;
        if (!agent) continue;
        var color = status === 'DONE' ? '#10b981' : status === 'FAILED' ? '#ef4444' : '#3b82f6';
        // Pulse the agent node
        _graphNodePulse(agent, color);
        // Send particle from agent to skill (if skill node exists)
        if (skill) _graphPulse(agent, skill, color);
      }
    };

    /* Particle render loop (only draws when particles exist) */
    function _pulseLoop() {
      if (!_cyInstance || _cyInstance.destroyed()) return;
      var w = container.offsetWidth, h = container.offsetHeight;
      if (_pulseCanvas.width !== w || _pulseCanvas.height !== h) {
        _pulseCanvas.width = w; _pulseCanvas.height = h;
      }
      _pulseCtx.clearRect(0, 0, w, h);

      for (var i = _particles.length - 1; i >= 0; i--) {
        var p = _particles[i];
        p.t += p.speed;
        if (p.t >= 1) { _particles.splice(i, 1); continue; }
        var x = p.sx + (p.tx - p.sx) * p.t;
        var y = p.sy + (p.ty - p.sy) * p.t;
        var alpha = p.t < 0.2 ? p.t * 5 : p.t > 0.8 ? (1 - p.t) * 5 : 1;
        _pulseCtx.globalAlpha = alpha * 0.7;
        _pulseCtx.fillStyle = p.color;
        _pulseCtx.beginPath();
        _pulseCtx.arc(x, y, 3, 0, Math.PI * 2);
        _pulseCtx.fill();
        // Glow trail
        _pulseCtx.globalAlpha = alpha * 0.25;
        _pulseCtx.beginPath();
        _pulseCtx.arc(x, y, 6, 0, Math.PI * 2);
        _pulseCtx.fill();
      }
      _pulseCtx.globalAlpha = 1;
      requestAnimationFrame(_pulseLoop);
    }
    requestAnimationFrame(_pulseLoop);
  }

  // Fetch full universe graph from fleet-overview endpoint
  apiFetch('/api/views/graph/fleet-overview').then(function(d) {
    var cyNodes = [];
    var cyEdges = [];
    var nodeIds = {};

    // API returns {sources: [{nodes:[], edges:[]}, ...]} — flatten all sources
    var allNodes = [];
    var allEdges = [];
    var sources = d.sources || [d];
    (Array.isArray(sources) ? sources : [sources]).forEach(function(src) {
      (src.nodes || []).forEach(function(n) { allNodes.push(n); });
      (src.edges || []).forEach(function(e) { allEdges.push(e); });
    });
    // Also check top-level (in case API format changes)
    if (d.nodes) allNodes = allNodes.concat(d.nodes);
    if (d.edges) allEdges = allEdges.concat(d.edges);

    allNodes.forEach(function(n) {
      var ntype = (n.type || 'unknown').toLowerCase();
      var style = nodeTypeStyle[ntype] || defaultStyle;
      var id = n.id || n.name || ('node-' + Math.random());
      if (nodeIds[id]) return; // deduplicate
      nodeIds[id] = true;
      cyNodes.push({
        data: {
          id: id,
          label: n.label || n.name || id,
          color: style.color,
          size: style.size,
          fontSize: style.fontSize,
          shape: style.shape,
          type: ntype,
          status: n.status || '',
          activity_score: n.activity_score || 0,
          parent: n.parent || undefined,
          count: (n.metrics || {}).count || 1,
        }
      });
    });
    allEdges.forEach(function(e) {
      var src = e.source || e.from;
      var tgt = e.target || e.to;
      if (src && tgt && nodeIds[src] && nodeIds[tgt]) {
        cyEdges.push({ data: { source: src, target: tgt, weight: e.weight || 1 } });
      }
    });

    /* ── Wire task nodes to their skill bucket ──────────────────────── */
    /* Task labels are "#72430 summarize" — extract skill, link to skill node.
       This pulls disconnected task rows into the graph clusters. */
    cyNodes.forEach(function(n) {
      if (n.data.type !== 'task') return;
      var label = n.data.label || '';
      var match = label.match(/^#\d+\s+(.+)$/);
      if (!match) return;
      var skillName = match[1].trim();
      // Find a skill node with matching ID or name
      var skillId = null;
      if (nodeIds[skillName]) { skillId = skillName; }
      else if (nodeIds['skill:' + skillName]) { skillId = 'skill:' + skillName; }
      if (skillId) {
        cyEdges.push({ data: { source: n.data.id, target: skillId } });
      }
    });

    // Validate parent references: remove parent if parent node doesn't exist
    cyNodes.forEach(function(n) {
      if (n.data.parent && !nodeIds[n.data.parent]) {
        n.data.parent = undefined;
      }
    });

    if (cyNodes.length > 0) {
      buildCyGraph(cyNodes, cyEdges);
    } else {
      throw new Error('No nodes from fleet-overview');
    }
  }).catch(function() {
    var el = document.getElementById('cytoscape-container');
    el.textContent = '';
    var msg = document.createElement('div');
    msg.className = 'empty-state';
    var t = document.createElement('div');
    t.className = 'empty-title';
    t.textContent = 'Universe graph unavailable';
    msg.appendChild(t);
    var sub = document.createElement('div');
    sub.style.cssText = 'color:var(--muted-foreground);font-size:12px;margin-top:4px';
    sub.textContent = 'Check /api/views/graph/fleet-overview endpoint';
    msg.appendChild(sub);
    el.appendChild(msg);
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   4. TASKS
   ══════════════════════════════════════════════════════════════════════ */
function loadTasks() {
  loadSkillPicker();
  loadRecentTasks();
}

function loadSkillPicker() {
  apiFetch('/api/skills/available').then(function(d) {
    var sel = document.getElementById('task-skill');
    sel.textContent = '';
    var defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = '-- Choose a skill --';
    sel.appendChild(defaultOpt);

    var skills = (d.skills || []).slice();
    // Sort alphabetically by name
    skills.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });

    // Group by: suite > first tag > first letter
    var groups = {};
    var groupOrder = [];
    skills.forEach(function(s) {
      var cat = '';
      if (s.suite) {
        cat = s.suite;
      } else if (s.tags && Array.isArray(s.tags) && s.tags.length > 0) {
        cat = s.tags[0];
      } else if (s.name) {
        cat = s.name.charAt(0).toUpperCase();
      } else {
        cat = 'Other';
      }
      // Capitalize category
      cat = cat.charAt(0).toUpperCase() + cat.slice(1);
      if (!groups[cat]) { groups[cat] = []; groupOrder.push(cat); }
      groups[cat].push(s);
    });

    // Sort group names
    groupOrder.sort();

    // If only single-letter groups (no real categories), just list flat
    var hasRealCategories = groupOrder.some(function(g) { return g.length > 1; });

    if (hasRealCategories) {
      groupOrder.forEach(function(cat) {
        var optgroup = document.createElement('optgroup');
        optgroup.label = cat;
        groups[cat].forEach(function(s) {
          var opt = document.createElement('option');
          opt.value = s.name;
          var desc = s.description || '';
          if (desc.length > 60) desc = desc.slice(0, 57) + '...';
          opt.textContent = s.name + (desc ? ' \u2014 ' + desc : '');
          optgroup.appendChild(opt);
        });
        sel.appendChild(optgroup);
      });
    } else {
      // Flat alphabetical list
      skills.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.name;
        var desc = s.description || '';
        if (desc.length > 60) desc = desc.slice(0, 57) + '...';
        opt.textContent = s.name + (desc ? ' \u2014 ' + desc : '');
        sel.appendChild(opt);
      });
    }
  }).catch(function() {});
}

function loadRecentTasks() {
  apiFetch('/api/timeline').then(function(data) {
    var el = document.getElementById('recent-tasks-list');
    el.textContent = '';
    var tasks = Array.isArray(data) ? data : (data.tasks || []);
    if (!tasks || tasks.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var icon = document.createElement('div');
      icon.className = 'empty-icon';
      icon.textContent = '\u26A1';
      var title = document.createElement('div');
      title.className = 'empty-title';
      title.textContent = 'No recent tasks';
      empty.appendChild(icon);
      empty.appendChild(title);
      el.appendChild(empty);
      return;
    }

    // Sort by most recent first: prefer id DESC, fallback to created_at DESC
    tasks.sort(function(a, b) {
      // Try by id first (higher id = more recent)
      if (a.id && b.id) {
        var idA = typeof a.id === 'number' ? a.id : parseInt(a.id);
        var idB = typeof b.id === 'number' ? b.id : parseInt(b.id);
        if (!isNaN(idA) && !isNaN(idB) && idA !== idB) return idB - idA;
      }
      // Fallback to created_at
      var tsA = a.created_at ? new Date(a.created_at).getTime() : 0;
      var tsB = b.created_at ? new Date(b.created_at).getTime() : 0;
      return tsB - tsA;
    });

    var table = document.createElement('table');
    table.className = 'data-table';
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    ['ID', 'Type', 'Status', 'Agent', 'Time'].forEach(function(h) {
      var th = document.createElement('th');
      th.textContent = h;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);
    var tbod = document.createElement('tbody');
    tasks.slice(0, 50).forEach(function(t) {
      var tr = document.createElement('tr');
      var tdId = document.createElement('td');
      tdId.style.cssText = 'font-family:monospace;font-size:12px';
      var taskId = t.id;
      if (taskId !== undefined && taskId !== null) {
        tdId.textContent = '#' + taskId;
      } else {
        tdId.textContent = '--';
      }
      var tdType = document.createElement('td');
      tdType.textContent = t.type || t.skill || '--';
      var tdStatus = document.createElement('td');
      tdStatus.appendChild(buildStatusBadge(t.status));
      var tdAgent = document.createElement('td');
      tdAgent.style.fontSize = '12px';
      tdAgent.textContent = t.assigned_to || t.agent || '--';
      var tdTime = document.createElement('td');
      tdTime.style.cssText = 'font-size:12px;color:var(--muted-foreground)';
      // Show actual relative time, try multiple timestamp fields
      var timestamp = t.created_at || t.updated_at || t.completed_at || t.timestamp;
      tdTime.textContent = timeAgo(timestamp);
      if (timestamp) {
        tdTime.title = new Date(timestamp).toLocaleString();
      }
      tr.appendChild(tdId);
      tr.appendChild(tdType);
      tr.appendChild(tdStatus);
      tr.appendChild(tdAgent);
      tr.appendChild(tdTime);
      tbod.appendChild(tr);
    });
    table.appendChild(tbod);
    el.appendChild(table);
  }).catch(function() {
    var el = document.getElementById('recent-tasks-list');
    el.textContent = '';
    var msg = document.createElement('div');
    msg.style.cssText = 'color:var(--danger);text-align:center;padding:16px';
    msg.textContent = 'Failed to load';
    el.appendChild(msg);
  });
}

function dispatchTask(e) {
  e.preventDefault();
  var skill = document.getElementById('task-skill').value;
  if (!skill) { showToast('Please select a skill', 'error'); return; }
  var payloadStr = document.getElementById('task-payload').value.trim();
  var payload = {};
  try { payload = JSON.parse(payloadStr || '{}'); } catch(ex) { showToast('Invalid JSON payload', 'error'); return; }
  var priority = parseInt(document.getElementById('task-priority').value) || 5;
  var assigned = document.getElementById('task-assign').value.trim() || null;

  apiFetch('/api/tasks/dispatch', {
    method: 'POST',
    body: { skill: skill, payload: payload, priority: priority, assigned_to: assigned }
  }).then(function(d) {
    showToast('Task dispatched: #' + d.task_id, 'success');
    loadRecentTasks();
  }).catch(function(e) {
    showToast('Dispatch failed: ' + e.message, 'error');
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   5. HITL
   ══════════════════════════════════════════════════════════════════════ */
function loadHITL() {
  apiFetch('/api/tasks/waiting-human').then(function(data) {
    var el = document.getElementById('hitl-list');
    el.textContent = '';
    var badge = document.getElementById('hitl-badge');
    if (data.length > 0) {
      badge.textContent = String(data.length);
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    if (data.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var icon = document.createElement('div');
      icon.className = 'empty-icon';
      icon.textContent = '\u2713';
      var title = document.createElement('div');
      title.className = 'empty-title';
      title.textContent = 'All caught up!';
      var desc = document.createElement('div');
      desc.className = 'empty-desc';
      desc.textContent = 'No tasks awaiting human input';
      empty.appendChild(icon);
      empty.appendChild(title);
      empty.appendChild(desc);
      el.appendChild(empty);
      return;
    }

    data.forEach(function(t) {
      var priority = 'low';
      var priorityCls = 'badge-info';
      if (t.type && (t.type.indexOf('security') >= 0 || t.type.indexOf('deploy') >= 0)) {
        priority = 'high'; priorityCls = 'badge-danger';
      } else if (t.type && (t.type.indexOf('review') >= 0 || t.type.indexOf('evolve') >= 0)) {
        priority = 'medium'; priorityCls = 'badge-warning';
      }

      var card = document.createElement('div');
      card.className = 'hitl-card';
      card.id = 'hitl-card-' + t.id;

      // Header
      var header = document.createElement('div');
      header.className = 'hitl-card-header';
      (function(taskId) {
        header.addEventListener('click', function() { toggleHITLCard(taskId); });
      })(t.id);
      var expandIcon = document.createElement('span');
      expandIcon.className = 'expand-icon';
      expandIcon.textContent = '\u25B6';
      var titleSpan = document.createElement('span');
      titleSpan.style.cssText = 'font-weight:600;flex:1';
      titleSpan.textContent = (t.type || 'Task') + ' #' + t.id;
      var priBadge = document.createElement('span');
      priBadge.className = 'badge ' + priorityCls;
      priBadge.textContent = priority;
      var metaSpan = document.createElement('span');
      metaSpan.style.cssText = 'font-size:11px;color:var(--muted-foreground)';
      metaSpan.textContent = (t.agent || '--') + ' \u00B7 ' + timeAgo(t.created_at);
      header.appendChild(expandIcon);
      header.appendChild(titleSpan);
      header.appendChild(priBadge);
      header.appendChild(metaSpan);

      // Body
      var body = document.createElement('div');
      body.className = 'hitl-card-body';
      var context = document.createElement('div');
      context.className = 'hitl-context';
      context.id = 'hitl-context-' + t.id;
      context.textContent = t.question || 'Loading question...';
      var actionsRow = document.createElement('div');
      actionsRow.className = 'hitl-actions';
      var textarea = document.createElement('textarea');
      textarea.className = 'input';
      textarea.id = 'hitl-response-' + t.id;
      textarea.placeholder = 'Type your response...';
      textarea.style.cssText = 'flex:1;min-height:60px';
      actionsRow.appendChild(textarea);
      var btnsRow = document.createElement('div');
      btnsRow.style.cssText = 'display:flex;gap:8px;margin-top:10px';
      var approveBtn = document.createElement('button');
      approveBtn.className = 'btn btn-success btn-sm';
      approveBtn.textContent = '\u2713 Approve & Respond';
      (function(taskId) {
        approveBtn.addEventListener('click', function() { respondHITL(taskId); });
      })(t.id);
      var rejectBtn = document.createElement('button');
      rejectBtn.className = 'btn btn-danger btn-sm';
      rejectBtn.textContent = '\u2717 Reject';
      (function(taskId) {
        rejectBtn.addEventListener('click', function() { rejectHITL(taskId); });
      })(t.id);
      btnsRow.appendChild(approveBtn);
      btnsRow.appendChild(rejectBtn);
      body.appendChild(context);
      body.appendChild(actionsRow);
      body.appendChild(btnsRow);

      card.appendChild(header);
      card.appendChild(body);
      el.appendChild(card);

      // Load question
      apiFetch('/api/tasks/' + t.id + '/question').then(function(q) {
        var ctx = document.getElementById('hitl-context-' + t.id);
        if (ctx && q.question) ctx.textContent = q.question;
      }).catch(function() {});
    });
  }).catch(function() {
    var el = document.getElementById('hitl-list');
    el.textContent = '';
    var msg = document.createElement('div');
    msg.style.cssText = 'color:var(--danger);text-align:center;padding:16px';
    msg.textContent = 'Failed to load HITL tasks';
    el.appendChild(msg);
  });
}

function toggleHITLCard(id) {
  var card = document.getElementById('hitl-card-' + id);
  if (card) card.classList.toggle('expanded');
}

function respondHITL(id) {
  var resp = document.getElementById('hitl-response-' + id);
  if (!resp || !resp.value.trim()) { showToast('Please enter a response', 'error'); return; }
  apiFetch('/api/tasks/' + id + '/respond', {
    method: 'POST',
    body: { response: resp.value.trim() }
  }).then(function() {
    showToast('Response sent for task #' + id, 'success');
    loadHITL();
  }).catch(function(e) { showToast('Failed: ' + e.message, 'error'); });
}

function rejectHITL(id) {
  apiFetch('/api/tasks/' + id + '/respond', {
    method: 'POST',
    body: { response: 'REJECTED by operator' }
  }).then(function() {
    showToast('Task #' + id + ' rejected', 'info');
    loadHITL();
  }).catch(function(e) { showToast('Failed: ' + e.message, 'error'); });
}

/* ══════════════════════════════════════════════════════════════════════════
   5b. OUTPUTS (Knowledge Browser + Unreviewed Queue)
   ══════════════════════════════════════════════════════════════════════ */

function _emptyMsg(parent, text) {
  parent.textContent = '';
  var d = document.createElement('div');
  d.style.cssText = 'color:var(--muted-foreground);padding:16px;text-align:center;font-size:13px';
  d.textContent = text;
  parent.appendChild(d);
}

function _errorMsg(parent, text) {
  parent.textContent = '';
  var d = document.createElement('div');

  preview.textContent = 'Loading...';

    preview.textContent = '';

function submitOutputFeedback(path, verdict, cardEl, notesId) {

    method: 'POST',
    body: { path: path, verdict: verdict, notes: notes }
  }).then(function() {
    showToast('Output ' + verdict, 'success');
    cardEl.style.transition = 'opacity 0.3s';
    cardEl.style.opacity = '0';
    setTimeout(function() { cardEl.remove(); }, 300);

function toggleQueuePause() {
  var wasPaused = _queuePaused;
  var url = wasPaused ? '/api/queue/resume' : '/api/queue/pause';
  // Optimistic UI update
  _queuePaused = !wasPaused;
  _updateQueuePauseUI();
  apiFetch(url, { method: 'POST', body: {} }).then(function() {
    showToast(wasPaused ? 'Queue resumed' : 'Queue paused', 'info');
  }).catch(function(e) {
    // Revert on failure
    _queuePaused = wasPaused;
    _updateQueuePauseUI();
    showToast('Failed: ' + e.message, 'error');
  });
}

function _updateQueuePauseUI() {
  var badge = document.getElementById('queue-status-badge');
  var btn = document.getElementById('queue-pause-btn');
  if (_queuePaused) {
    badge.className = 'badge badge-warning';
    badge.textContent = 'Paused';
    btn.textContent = '\u25B6 Resume';
    btn.className = 'btn btn-success btn-sm';
  } else {
    badge.className = 'badge badge-success';
    badge.textContent = 'Active';
    btn.textContent = '\u23F8 Pause';
    btn.className = 'btn btn-warning btn-sm';
  }
}

function removeFromQueue(id) {
  apiFetch('/api/queue/' + id, { method: 'DELETE' }).then(function() {
    showToast('Task #' + id + ' removed', 'success');
    loadQueueList();
  }).catch(function(e) { showToast('Failed: ' + e.message, 'error'); });
}

function qDragStart(e) {
  _dragSrcIdx = parseInt(e.currentTarget.dataset.idx);
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', e.currentTarget.dataset.id);
}
function qDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function qDrop(e) {
  e.preventDefault();
  var targetIdx = parseInt(e.currentTarget.dataset.idx);
  if (_dragSrcIdx === targetIdx) return;
  var items = document.querySelectorAll('#queue-list .queue-item');
  var ids = [];
  items.forEach(function(item) { ids.push(parseInt(item.dataset.id)); });
  var srcId = ids.splice(_dragSrcIdx, 1)[0];
  ids.splice(targetIdx, 0, srcId);
  apiFetch('/api/queue/reorder', { method: 'POST', body: { task_ids: ids } }).then(function() {
    showToast('Queue reordered', 'success');
    loadQueueList();
  }).catch(function(e) { showToast('Reorder failed: ' + e.message, 'error'); });
}

/* ── Analytics: Neural Lane Map ─────────────────────────────────────────── */
var _analyticsNeuralAnim = null;
var _analyticsNeuralData = null;
var _analyticsNeuralPulses = [];

function loadAnalyticsLanes() {
  apiFetch('/api/activity/lanes?hours=24').then(function(data) {
    _analyticsNeuralData = data;
    _analyticsNeuralPulses = [];
    (data.timeline || []).forEach(function(t) {
      _analyticsNeuralPulses.push({
        agent: t.agent, skill: t.skill, status: t.status,
        x: Math.random(), alpha: 0.3 + Math.random() * 0.5,
        speed: 0.001 + Math.random() * 0.002, size: 2 + Math.random() * 3
      });
    });
    if (!_analyticsNeuralAnim) _analyticsNeuralAnim = requestAnimationFrame(renderAnalyticsNeuralFrame);
  }).catch(function() {});
}

function renderAnalyticsNeuralFrame() {
  var canvas = document.getElementById('analytics-neural-canvas');
  if (!canvas || !_analyticsNeuralData) { _analyticsNeuralAnim = null; return; }
  if (canvas.offsetParent === null) { _analyticsNeuralAnim = requestAnimationFrame(renderAnalyticsNeuralFrame); return; }
  var rect = canvas.parentElement.getBoundingClientRect();
  var dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
  var ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  var w = rect.width, h = rect.height; ctx.clearRect(0, 0, w, h);
  var lanes = _analyticsNeuralData.lanes || [];
  var skills = _analyticsNeuralData.skills || [];
  var folders = _analyticsNeuralData.folders || [];
  var edges = _analyticsNeuralData.edges || [];
  if (lanes.length === 0) {
    ctx.fillStyle = 'rgba(148,163,184,0.5)'; ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.fillText('No activity in last 24h', w / 2, h / 2);
    _analyticsNeuralAnim = null; return;
  }
  var labelW = 90, barStart = labelW + 8, sideW = 120;
  var barW = w - barStart - sideW - 10;
  var maxLanes = Math.min(lanes.length, 14);
  var laneH = Math.min(22, (h - 30) / Math.max(maxLanes, 1));
  var laneGap = 2, topOff = 10;
  var _agentLanes2 = lanes.filter(function(l) { return l.kind !== 'model'; });
  var _modelLanes2 = lanes.filter(function(l) { return l.kind === 'model'; });
  var _maxAgent2 = Math.max.apply(null, _agentLanes2.map(function(l) { return l.total; }).concat([1]));
  var _maxModel2 = Math.max.apply(null, _modelLanes2.map(function(l) { return l.total; }).concat([1]));
  var kindColor = { agent: '#10b981', model: '#a78bfa', factorio: '#f97316' };
  var statusColor = { done: '#10b981', failed: '#ef4444', running: '#3b82f6' };
  var laneMap = {};
  for (var i = 0; i < maxLanes; i++) {
    var lane = lanes[i]; var y = topOff + i * (laneH + laneGap);
    ctx.fillStyle = kindColor[lane.kind] || '#64748b'; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(labelW + 2, y + laneH / 2, 3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,0.03)'; ctx.beginPath(); ctx.roundRect(barStart, y, barW, laneH, 3); ctx.fill();
    var _laneMax2 = lane.kind === 'model' ? _maxModel2 : _maxAgent2;
    var scale = barW / _laneMax2, cx = barStart;
    [{v:lane.done,c:statusColor.done},{v:lane.failed,c:statusColor.failed},{v:lane.running,c:statusColor.running}].forEach(function(s){
      if(s.v<=0)return; var sw=Math.max(s.v*scale,2); ctx.globalAlpha=0.65; ctx.fillStyle=s.c;
      ctx.beginPath(); ctx.roundRect(cx,y+2,sw,laneH-4,2); ctx.fill(); ctx.globalAlpha=1; cx+=sw;
    });
    ctx.fillStyle = lane.running > 0 ? '#e2e8f0' : '#94a3b8';
    ctx.font = (lane.running > 0 ? 'bold ' : '') + '10px system-ui, sans-serif';
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(lane.agent.length > 12 ? lane.agent.slice(0, 11) + '\u2026' : lane.agent, labelW - 4, y + laneH / 2);
    ctx.fillStyle = '#64748b'; ctx.font = '9px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(lane.total + (lane.cost ? ' $' + lane.cost : ''), cx + 5, y + laneH / 2);
    lane._y = y; lane._laneH = laneH; laneMap[lane.agent] = i;
  }
  ctx.globalAlpha = 0.1; ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 1;
  edges.forEach(function(e) {
    var si = laneMap[e.source], ti = laneMap[e.target]; if (si === undefined || ti === undefined) return;
    var sy2 = topOff + si * (laneH + laneGap) + laneH / 2, ty2 = topOff + ti * (laneH + laneGap) + laneH / 2;
    ctx.beginPath(); ctx.moveTo(barStart, sy2); ctx.bezierCurveTo(barStart - 12, sy2, barStart - 12, ty2, barStart, ty2); ctx.stroke();
  }); ctx.globalAlpha = 1;
  var sideX = barStart + barW + 12, sy = topOff, sideBottom = h - 4;
  ctx.save(); ctx.beginPath(); ctx.rect(sideX - 2, topOff - 2, sideW + 4, sideBottom - topOff + 4); ctx.clip();
  if (skills.length > 0) {
    ctx.fillStyle = '#f59e0b'; ctx.font = 'bold 9px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('TOP SKILLS', sideX, sy + 4); sy += 12;
    skills.slice(0, 8).forEach(function(sk) { if (sy > sideBottom) return;
      ctx.fillStyle = '#94a3b8'; ctx.font = '9px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(sk.skill.length > 14 ? sk.skill.slice(0, 13) + '\u2026' : sk.skill, sideX, sy + 4);
      ctx.fillStyle = '#64748b'; ctx.font = '8px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(sk.total + '', sideX + sideW - 8, sy + 4); ctx.textAlign = 'left'; sy += 13;
    });
  }
  if (folders.length > 0 && sy < sideBottom - 20) {
    sy += 4; ctx.fillStyle = '#06b6d4'; ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.fillText('KNOWLEDGE', sideX, sy + 4); sy += 12;
    folders.slice(0, 5).forEach(function(fo) { if (sy > sideBottom) return;
      ctx.fillStyle = '#94a3b8'; ctx.font = '9px system-ui, sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(fo.name.length > 11 ? fo.name.slice(0, 10) + '\u2026' : fo.name, sideX, sy + 4);
      ctx.fillStyle = '#64748b'; ctx.font = '8px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText(fo.files + '', sideX + sideW - 8, sy + 4); ctx.textAlign = 'left'; sy += 13;
    });
  }
  ctx.restore();
  _analyticsNeuralPulses.forEach(function(p) {
    var li = laneMap[p.agent]; if (li === undefined) return;
    var lane = lanes[li], py = lane._y + lane._laneH / 2, px = barStart + p.x * barW;
    var col = statusColor[p.status.toLowerCase()] || statusColor.done;
    ctx.globalAlpha = p.alpha * 0.35; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(px, py, p.size * 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = p.alpha; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
    p.x += p.speed; p.alpha -= 0.002;
    if (p.x > 1.1 || p.alpha <= 0) {
      p.x = -0.05; p.alpha = 0.3 + Math.random() * 0.5; p.speed = 0.001 + Math.random() * 0.002;
      var active = lanes.filter(function(l) { return l.total > 0; });
      if (active.length) { var rl = active[Math.floor(Math.random() * active.length)]; p.agent = rl.agent; p.status = rl.running > 0 ? 'RUNNING' : 'DONE'; }
    }
  });
  _analyticsNeuralAnim = requestAnimationFrame(renderAnalyticsNeuralFrame);
}

function enableGate() {
  var budget = parseFloat(document.getElementById('gate-budget-slider').value) || 5;
  var ttl = parseInt(document.getElementById('gate-ttl').value, 10) || 0;
  var providers = [];
  var cbs = document.querySelectorAll('.gate-provider-cb');
  for (var i = 0; i < cbs.length; i++) {
    if (cbs[i].checked) providers.push(cbs[i].value);
  }
  var drain = 'none';
  var radios = document.querySelectorAll('input[name="gate-drain"]');
  for (var j = 0; j < radios.length; j++) {
    if (radios[j].checked) { drain = radios[j].value; break; }
  }

  apiFetch('/api/gate/enable', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      budget_cap: budget,
      ttl_seconds: ttl,
      providers: providers,
      drain_mode: drain
    })
  }).then(function(d) {
    updateGateUI(d);
  }).catch(function() {
    var badge = document.getElementById('gate-status-badge');
    if (badge) {
      badge.className = 'badge badge-danger';
      badge.textContent = 'Error';
    }
  });
}

function disableGate() {
  apiFetch('/api/gate/disable', {
    method: 'POST'
  }).then(function(d) {
    updateGateUI(d);
  }).catch(function() {
    var badge = document.getElementById('gate-status-badge');
    if (badge) {
      badge.className = 'badge badge-danger';
      badge.textContent = 'Error';
    }
  });
}

function updateGateUI(data) {
  if (!data) return;
  var badge = document.getElementById('gate-status-badge');
  if (badge) {
    if (data.enabled) {
      badge.className = 'badge badge-success';
      badge.textContent = 'Active';
    } else {
      badge.className = 'badge badge-muted';
      badge.textContent = 'Disabled';
    }
  }

  // Update spend bar
  var budgetCap = data.budget_cap || parseFloat(document.getElementById('gate-budget-slider').value) || 5;
  var spent = data.spent || 0;
  var pct = budgetCap > 0 ? Math.min(100, (spent / budgetCap) * 100) : 0;

  var bar = document.getElementById('gate-spend-bar');
  if (bar) {
    bar.style.width = pct + '%';
    if (pct > 80) bar.style.background = 'var(--danger)';
    else if (pct > 50) bar.style.background = 'var(--warning)';
    else bar.style.background = 'var(--success)';
  }

  var amountEl = document.getElementById('gate-spend-amount');
  if (amountEl) {
    amountEl.textContent = '$' + spent.toFixed(2) + ' / $' + budgetCap.toFixed(2);
  }

  // Sync slider if server sends budget
  if (data.budget_cap !== undefined) {
    var slider = document.getElementById('gate-budget-slider');
    if (slider) {
      if (data.budget_cap > parseFloat(slider.max)) slider.max = String(data.budget_cap);
      slider.value = String(data.budget_cap);
      var valEl = document.getElementById('gate-budget-value');
      if (valEl) valEl.textContent = '$' + data.budget_cap.toFixed(2);
    }
  }

  // Sync drain mode
  if (data.drain_mode) {
    var radios = document.querySelectorAll('input[name="gate-drain"]');
    for (var i = 0; i < radios.length; i++) {
      radios[i].checked = (radios[i].value === data.drain_mode);
    }
  }

  // Sync providers
  if (data.providers && Array.isArray(data.providers)) {
    var cbs = document.querySelectorAll('.gate-provider-cb');
    for (var j = 0; j < cbs.length; j++) {
      cbs[j].checked = data.providers.indexOf(cbs[j].value) >= 0;
    }
  }

  // Sync TTL
  if (data.ttl_seconds !== undefined) {
    var ttlSel = document.getElementById('gate-ttl');
    if (ttlSel) ttlSel.value = String(data.ttl_seconds);
  }
}

var _tierColors = { paid: '#ef4444', freemium: '#f59e0b', free: '#10b981', unknown: '#64748b' };

function loadApiKeys() {
  apiFetch('/api/keys/status').then(function(d) {
    var container = document.getElementById('api-keys-list');
    container.textContent = '';
    if (!d.keys || !d.keys.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--muted-foreground);font-size:12px;padding:8px;';
      empty.textContent = 'No keys registered in keys_registry.toml';
      container.appendChild(empty);
      return;
    }
    d.keys.forEach(function(key) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);';

      // Status dot
      var dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;flex-shrink:0;background:' + (key.is_set ? 'var(--success)' : 'var(--danger)') + ';';
      row.appendChild(dot);

      // Label + purpose
      var info = document.createElement('div');
      info.style.cssText = 'flex:1;min-width:0;';
      var label = document.createElement('div');
      label.style.cssText = 'font-size:13px;font-weight:600;';
      label.textContent = key.label;
      var purpose = document.createElement('div');
      purpose.style.cssText = 'font-size:11px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      purpose.textContent = key.purpose;
      info.appendChild(label);
      info.appendChild(purpose);
      row.appendChild(info);

      // Tier badge
      var tier = document.createElement('span');
      var tc = _tierColors[key.tier] || _tierColors.unknown;
      tier.style.cssText = 'font-size:10px;padding:2px 6px;border-radius:3px;background:' + tc + '22;color:' + tc + ';flex-shrink:0;';
      tier.textContent = key.tier;
      row.appendChild(tier);

      // Skills
      var skills = document.createElement('span');
      skills.style.cssText = 'font-size:10px;color:var(--muted-foreground);width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      skills.textContent = (key.skills || []).join(', ') || '—';
      skills.title = (key.skills || []).join(', ');
      row.appendChild(skills);

      // Value / entry area
      var action = document.createElement('div');
      action.style.cssText = 'width:200px;flex-shrink:0;display:flex;gap:4px;align-items:center;';

      if (key.is_set) {
        var masked = document.createElement('span');
        masked.style.cssText = 'font-size:11px;color:var(--muted-foreground);font-family:monospace;';
        masked.textContent = key.masked;
        action.appendChild(masked);

        var changeBtn = document.createElement('button');
        changeBtn.className = 'btn btn-sm btn-outline';
        changeBtn.style.cssText = 'font-size:10px;padding:1px 6px;margin-left:auto;';
        changeBtn.textContent = 'Change';
        (function(k) {
          changeBtn.onclick = function() { showKeyInput(k.env_var, action); };
        })(key);
        action.appendChild(changeBtn);
      } else {
        showKeyInput(key.env_var, action, key.signup_hint);
      }

      row.appendChild(action);
      container.appendChild(row);
    });
  }).catch(function() {
    var container = document.getElementById('api-keys-list');
    container.textContent = '';
    var err = document.createElement('div');
    err.style.cssText = 'color:var(--danger);font-size:12px;';
    err.textContent = 'Failed to load API keys';
    container.appendChild(err);
  });
}

function showKeyInput(envVar, container, signupHint) {
  container.textContent = '';
  var input = document.createElement('input');
  input.type = 'password';
  input.placeholder = 'Paste key...';
  input.style.cssText = 'flex:1;font-size:11px;padding:3px 6px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font-family:monospace;';

  var saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-sm';
  saveBtn.style.cssText = 'font-size:10px;padding:2px 8px;';
  saveBtn.textContent = 'Save';
  saveBtn.onclick = function() {
    var val = input.value.trim();
    if (!val) return;
    saveBtn.textContent = '...';
    saveBtn.disabled = true;
    apiFetch('/api/keys/set', { method: 'POST', body: { key_name: envVar, value: val } })
      .then(function() { loadApiKeys(); })
      .catch(function() { saveBtn.textContent = 'Error'; });
  };

  container.appendChild(input);
  container.appendChild(saveBtn);

  if (signupHint) {
    var hint = document.createElement('a');
    hint.href = 'https://' + signupHint.split(' ')[0];
    hint.target = '_blank';
    hint.style.cssText = 'font-size:10px;color:var(--primary);text-decoration:none;flex-shrink:0;';
    hint.textContent = '?';
    hint.title = signupHint;
    container.appendChild(hint);
  }
}

   8. SETTINGS — 6 Category Tabs
   ========================================================================== */
var _settingsTabDefs = [
  { id: 'general',    label: 'General',     sections: ['fleet','naming','dashboard','logging','ditl'] },
  { id: 'models',     label: 'Models',      sections: ['models','models.tiers','review','idle'] },
  { id: 'hardware',   label: 'Hardware',    sections: ['thermal','gpu','ollama','thermal.vram','workers','capacity'] },
  { id: 'apikeys',    label: 'API & Keys',  sections: ['api_gate','_api_keys'] },
  { id: 'operations', label: 'Operations',  sections: ['backup','schedules','mcp','ingest','dispatch_bridge'] },
  { id: 'display',    label: 'Display',     sections: ['_live_columns'] },
  { id: 'advanced',   label: 'Advanced',    sections: ['federation','security','sso','billing','enterprise','compliance'] }
];
var _activeSettingsTab = 'general';
var _settingsCache = { settings: null, schema: null };

function loadSettings() {
  _buildSettingsTabBar();
  switchSettingsTab('general');
}

function _loadFederationPeers() {
  var list = document.getElementById('federation-peer-list');
  if (!list) return;
  apiFetch('/api/settings').then(function(d) {
    var fed = (d.settings || {}).federation || {};
    var peers = (fed.values || {}).peers || [];
    list.textContent = '';
    if (!peers.length) {
      var empty = document.createElement('div');
      empty.textContent = 'No peers linked yet';
      empty.style.cssText = 'font-size:12px;color:var(--muted-foreground);padding:8px 0;';
      list.appendChild(empty);
      return;
    }
    peers.forEach(function(url) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);margin-bottom:4px;';
      var dot = document.createElement('span');
      dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0;';
      dot.title = 'Status unknown';
      row.appendChild(dot);
      var urlSpan = document.createElement('span');
      urlSpan.textContent = url;
      urlSpan.style.cssText = 'font-size:12px;font-family:monospace;color:var(--foreground);flex:1;';
      row.appendChild(urlSpan);
      var removeBtn = document.createElement('button');
      removeBtn.className = 'btn btn-sm';
      removeBtn.textContent = 'Unlink';
      removeBtn.style.cssText = 'font-size:10px;padding:2px 8px;color:var(--danger);';
      removeBtn.onclick = function() {
        apiFetch('/api/settings/update', {
          method: 'POST',
          body: { section: 'federation', key: 'peers', value: url, action: 'remove' }
        }).then(function() { _loadFederationPeers(); });
      };
      row.appendChild(removeBtn);
      list.appendChild(row);
      // Probe peer health
      fetch(url + '/api/health', { signal: AbortSignal.timeout(3000) })
        .then(function(r) { if (r.ok) { dot.style.background = '#10b981'; dot.title = 'Online'; } else { dot.style.background = '#ef4444'; dot.title = 'Error'; } })
        .catch(function() { dot.style.background = '#64748b'; dot.title = 'Unreachable'; });
    });
  }).catch(function() {});
}

function _loadFederationToggles() {
  apiFetch('/api/settings').then(function(d) {
    var fed = (d.settings || {}).federation || {};
    var vals = fed.values || {};
    var el;
    el = document.getElementById('fed-toggle-enabled');
    if (el) el.checked = !!vals.enabled;
    el = document.getElementById('fed-toggle-discovery_enabled');
    if (el) el.checked = vals.discovery_enabled !== false;
    el = document.getElementById('fed-toggle-routing_enabled');
    if (el) el.checked = vals.routing_enabled !== false;
  }).catch(function() {});
}

function _buildSettingsTabBar() {
  var bar = document.getElementById('settings-tab-bar');
  bar.textContent = '';
  _settingsTabDefs.forEach(function(tab) {
    var btn = document.createElement('button');
    btn.className = 'settings-tab' + (tab.id === _activeSettingsTab ? ' active' : '');
    btn.textContent = tab.label;
    btn.setAttribute('data-tab', tab.id);
    (function(tabId) {
      btn.addEventListener('click', function() { switchSettingsTab(tabId); });
    })(tab.id);
    bar.appendChild(btn);
  });
}

function switchSettingsTab(tabId) {
  _activeSettingsTab = tabId;
  var tabs = document.querySelectorAll('#settings-tab-bar .settings-tab');
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    if (t.getAttribute('data-tab') === tabId) {
      t.classList.add('active');
    } else {
      t.classList.remove('active');
    }
  }
  loadSettingsTab(tabId);
}

function loadSettingsTab(tabId) {
  var content = document.getElementById('settings-tab-content');
  content.textContent = '';
  var spinner = document.createElement('div');
  spinner.className = 'spinner';
  content.appendChild(spinner);

  var tabDef = null;
  for (var i = 0; i < _settingsTabDefs.length; i++) {
    if (_settingsTabDefs[i].id === tabId) { tabDef = _settingsTabDefs[i]; break; }
  }
  if (!tabDef) return;

  /* Special case: API & Keys tab has custom sub-sections */
  if (tabId === 'apikeys') {
    _loadApiKeysTab(content);
    return;
  }

  /* Special case: Advanced tab — Link to BigEd + federation */
  if (tabId === 'advanced') {
    content.textContent = '';

    // ── Link to BigEd ──
    var linkCard = document.createElement('div');
    linkCard.style.cssText = 'border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;';

    var linkTitle = document.createElement('h3');
    linkTitle.textContent = 'Link to a BigEd';
    linkTitle.style.cssText = 'font-size:16px;font-weight:700;margin-bottom:4px;color:var(--foreground);';
    linkCard.appendChild(linkTitle);

    var linkDesc = document.createElement('p');
    linkDesc.textContent = 'Connect this instance to other BigEd fleets on your network. The host RAG serves as the primary knowledge source for all linked instances.';
    linkDesc.style.cssText = 'font-size:12px;color:var(--muted-foreground);margin-bottom:16px;';
    linkCard.appendChild(linkDesc);

    // Current peers
    var peersLabel = document.createElement('div');
    peersLabel.textContent = 'Linked Peers';
    peersLabel.style.cssText = 'font-size:12px;font-weight:600;color:var(--foreground);margin-bottom:8px;';
    linkCard.appendChild(peersLabel);

    var peerList = document.createElement('div');
    peerList.id = 'federation-peer-list';
    peerList.style.cssText = 'margin-bottom:12px;';
    linkCard.appendChild(peerList);

    // Add peer input
    var addRow = document.createElement('div');
    addRow.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:16px;';

    var peerInput = document.createElement('input');
    peerInput.type = 'text';
    peerInput.placeholder = 'https://192.168.1.50:5555';
    peerInput.id = 'federation-peer-input';
    peerInput.style.cssText = 'flex:1;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font-family:monospace;';
    addRow.appendChild(peerInput);

    var addBtn = document.createElement('button');
    addBtn.className = 'btn btn-sm btn-primary';
    addBtn.textContent = 'Link';
    addBtn.onclick = function() {
      var url = peerInput.value.trim();
      if (!url) return;
      addBtn.textContent = '...';
      apiFetch('/api/settings/update', {
        method: 'POST',
        body: { section: 'federation', key: 'peers', value: url, action: 'append' }
      }).then(function() {
        peerInput.value = '';
        addBtn.textContent = 'Link';
        _loadFederationPeers();
      }).catch(function() {
        addBtn.textContent = 'Error';
        setTimeout(function() { addBtn.textContent = 'Link'; }, 2000);
      });
    };
    addRow.appendChild(addBtn);
    linkCard.appendChild(addRow);

    // Federation toggles
    var toggleGrid = document.createElement('div');
    toggleGrid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:10px;';

    var fedToggles = [
      { key: 'enabled', label: 'Federation Enabled', desc: 'Allow peer discovery and task forwarding' },
      { key: 'discovery_enabled', label: 'Auto-Discovery', desc: 'Find peers on local network (UDP/mDNS)' },
      { key: 'routing_enabled', label: 'Task Routing', desc: 'Forward overflow tasks to peers' },
    ];

    fedToggles.forEach(function(t) {
      var item = document.createElement('label');
      item.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.id = 'fed-toggle-' + t.key;
      cb.addEventListener('change', function() {
        apiFetch('/api/settings/update', {
          method: 'POST',
          body: { section: 'federation', key: t.key, value: cb.checked }
        }).catch(function() { cb.checked = !cb.checked; });
      });
      item.appendChild(cb);
      var textWrap = document.createElement('div');
      var lbl = document.createElement('div');
      lbl.textContent = t.label;
      lbl.style.cssText = 'font-size:13px;font-weight:600;color:var(--foreground);';
      textWrap.appendChild(lbl);
      var d = document.createElement('div');
      d.textContent = t.desc;
      d.style.cssText = 'font-size:10px;color:var(--muted-foreground);';
      textWrap.appendChild(d);
      item.appendChild(textWrap);
      toggleGrid.appendChild(item);
    });

    // RAG host toggle
    var ragItem = document.createElement('label');
    ragItem.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;';
    var ragCb = document.createElement('input');
    ragCb.type = 'checkbox';
    ragCb.checked = true;
    ragCb.id = 'fed-toggle-rag-host';
    ragItem.appendChild(ragCb);
    var ragText = document.createElement('div');
    var ragLbl = document.createElement('div');
    ragLbl.textContent = 'RAG Host Mode';
    ragLbl.style.cssText = 'font-size:13px;font-weight:600;color:var(--foreground);';
    ragText.appendChild(ragLbl);
    var ragDesc = document.createElement('div');
    ragDesc.textContent = 'This instance serves as the primary RAG source for linked peers';
    ragDesc.style.cssText = 'font-size:10px;color:var(--muted-foreground);';
    ragText.appendChild(ragDesc);
    ragItem.appendChild(ragText);
    toggleGrid.appendChild(ragItem);

    linkCard.appendChild(toggleGrid);
    content.appendChild(linkCard);

    // Load current federation state
    _loadFederationPeers();
    _loadFederationToggles();
    return;
  }

  /* Special case: Display tab — Live Activity column toggles */
  if (tabId === 'display') {
    content.textContent = '';
    var heading = document.createElement('h3');
    heading.textContent = 'Live Activity Columns';
    heading.style.cssText = 'font-size:14px;font-weight:600;margin-bottom:12px;color:var(--foreground);';
    content.appendChild(heading);
    var desc = document.createElement('p');
    desc.textContent = 'Choose which data columns appear in the Live Activity feed.';
    desc.style.cssText = 'font-size:12px;color:var(--muted-foreground);margin-bottom:16px;';
    content.appendChild(desc);

    var prefs = _getLiveColumnPrefs();
    var grid = document.createElement('div');
    grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:8px;';
    Object.keys(_liveColumns).forEach(function(col) {
      var lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:13px;color:var(--foreground);';
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!prefs[col];
      cb.addEventListener('change', function() {
        _setLiveColumnPref(col, cb.checked);
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(_liveColumns[col].label));
      grid.appendChild(lbl);
    });
    content.appendChild(grid);
    return;
  }

  Promise.all([
    apiFetch('/api/settings'),
    apiFetch('/api/settings/schema')
  ]).then(function(results) {
    _settingsCache.settings = results[0].settings || {};
    _settingsCache.schema = results[1].schema || {};
    content.textContent = '';

    var rendered = false;
    tabDef.sections.forEach(function(section) {
      if (section.charAt(0) === '_') return;
      var sectionSchema = _settingsCache.schema[section];
      if (!sectionSchema) return;
      var sectionData = _settingsCache.settings[section] || {};
      var sectionValues = sectionData.values || {};
      // Flatten nested TOML sub-tables (e.g. ollama.optimization → {flash_attention: ...})
      var flatValues = {};
      Object.keys(sectionValues).forEach(function(k) {
        if (sectionValues[k] && typeof sectionValues[k] === 'object' && !Array.isArray(sectionValues[k])) {
          Object.keys(sectionValues[k]).forEach(function(subK) { flatValues[subK] = sectionValues[k][subK]; });
        } else {
          flatValues[k] = sectionValues[k];
        }
      });
      var isEditable = sectionData.editable;
      _renderSettingsSection(content, section, sectionSchema, flatValues, isEditable);
      rendered = true;
    });

    if (!rendered) {
      var empty = document.createElement('div');
      empty.style.cssText = 'color:var(--muted-foreground);text-align:center;padding:24px;font-size:13px';
      empty.textContent = 'No configuration sections available for this category.';
      content.appendChild(empty);
    }
  }).catch(function() {
    content.textContent = '';
    var msg = document.createElement('div');
    msg.style.cssText = 'color:var(--danger);text-align:center;padding:16px';
    msg.textContent = 'Failed to load settings';
    content.appendChild(msg);
  });
}

function _renderSettingsSection(parent, section, schema, values, editable) {
  var sectionDiv = document.createElement('div');
  sectionDiv.style.marginBottom = '24px';

  var sectionTitle = document.createElement('div');
  sectionTitle.style.cssText = 'font-size:14px;font-weight:700;color:var(--foreground);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px';
  sectionTitle.textContent = section;
  if (!editable) {
    var roTag = document.createElement('span');
    roTag.className = 'badge badge-muted';
    roTag.style.cssText = 'font-size:9px;vertical-align:middle;margin-left:8px';
    roTag.textContent = 'Read-only';
    sectionTitle.appendChild(document.createTextNode(' '));
    sectionTitle.appendChild(roTag);
  }
  sectionDiv.appendChild(sectionTitle);

  Object.keys(schema).forEach(function(key) {
    var info = schema[key];
    var val = values[key];

    var item = document.createElement('div');
    item.className = 'settings-item';

    var iconEl = document.createElement('div');
    iconEl.className = 'settings-icon';
    var iconChar = '\u2699';
    if (key.indexOf('temp') >= 0 || key.indexOf('thermal') >= 0) iconChar = '\uD83D\uDD25';
    else if (key.indexOf('model') >= 0) iconChar = '\uD83E\uDD16';
    else if (key.indexOf('backup') >= 0) iconChar = '\uD83D\uDCBE';
    else if (key.indexOf('port') >= 0 || key.indexOf('address') >= 0) iconChar = '\uD83C\uDF10';
    iconEl.textContent = iconChar;

    var infoDiv = document.createElement('div');
    infoDiv.className = 'settings-info';
    var labelEl = document.createElement('div');
    labelEl.className = 'settings-label';
    labelEl.textContent = key;
    var descEl = document.createElement('div');
    descEl.className = 'settings-desc';
    descEl.textContent = info.description || '';
    infoDiv.appendChild(labelEl);
    infoDiv.appendChild(descEl);

    var ctrlDiv = document.createElement('div');
    ctrlDiv.className = 'settings-control';

    if (info.type === 'bool' && editable) {
      var toggleLabel = document.createElement('label');
      toggleLabel.className = 'toggle';
      var toggleInput = document.createElement('input');
      toggleInput.type = 'checkbox';
      toggleInput.checked = !!val;
      (function(sec, k) {
        toggleInput.addEventListener('change', function() { _saveSettingField(sec, k, this.checked); });
      })(section, key);
      var toggleSlider = document.createElement('span');
      toggleSlider.className = 'toggle-slider';
      toggleLabel.appendChild(toggleInput);
      toggleLabel.appendChild(toggleSlider);
      ctrlDiv.appendChild(toggleLabel);
    } else if (info.type === 'bool') {
      var boolBadge = document.createElement('span');
      boolBadge.className = 'badge ' + (val ? 'badge-success' : 'badge-muted');
      boolBadge.textContent = val ? 'On' : 'Off';
      ctrlDiv.appendChild(boolBadge);
    } else if (editable) {
      var inputEl = document.createElement('input');
      inputEl.className = 'input';
      inputEl.style.cssText = 'width:120px;text-align:right';
      inputEl.value = val !== undefined ? String(val) : '';
      (function(sec, k, typ) {
        inputEl.addEventListener('blur', function() { _saveSettingField(sec, k, this.value, typ); });
        inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') this.blur(); });
      })(section, key, info.type);
      ctrlDiv.appendChild(inputEl);
    } else {
      var valSpan = document.createElement('span');
      valSpan.style.cssText = 'font-size:13px;font-weight:500;color:var(--foreground)';
      valSpan.textContent = val !== undefined ? String(val) : '--';
      ctrlDiv.appendChild(valSpan);
    }

    item.appendChild(iconEl);
    item.appendChild(infoDiv);
    item.appendChild(ctrlDiv);
    sectionDiv.appendChild(item);
  });
  parent.appendChild(sectionDiv);
}

function _loadApiKeysTab(content) {
  content.textContent = '';

  /* API Keys panel */
  var keysPanel = document.createElement('div');
  keysPanel.style.marginBottom = '24px';

  var keysHeader = document.createElement('div');
  keysHeader.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:12px';
  var keysTitle = document.createElement('h3');
  keysTitle.style.cssText = 'margin:0;font-size:14px;font-weight:600';
  keysTitle.textContent = 'API KEYS';
  keysHeader.appendChild(keysTitle);

  var refreshBtn = document.createElement('button');
  refreshBtn.className = 'btn btn-sm btn-outline';
  refreshBtn.textContent = 'Refresh';
  refreshBtn.addEventListener('click', function() { loadSettingsTab('apikeys'); });
  keysHeader.appendChild(refreshBtn);
  keysPanel.appendChild(keysHeader);

  var keysList = document.createElement('div');
  keysList.id = 'api-keys-list';
  var keysSpinner = document.createElement('div');
  keysSpinner.className = 'spinner';
  keysList.appendChild(keysSpinner);
  keysPanel.appendChild(keysList);
  content.appendChild(keysPanel);

  /* Gate card mount */
  var gateMount = document.createElement('div');
  gateMount.id = 'gate-card-mount';
  gateMount.style.marginBottom = '16px';
  content.appendChild(gateMount);

  /* Load api_gate config settings below the gate card */
  Promise.all([
    apiFetch('/api/settings'),
    apiFetch('/api/settings/schema')
  ]).then(function(results) {
    _settingsCache.settings = results[0].settings || {};
    _settingsCache.schema = results[1].schema || {};

    var gateSchema = _settingsCache.schema['api_gate'];
    if (gateSchema) {
      var gateValues = (_settingsCache.settings['api_gate'] && _settingsCache.settings['api_gate'].values) || {};
      var gateEditable = _settingsCache.settings['api_gate'] && _settingsCache.settings['api_gate'].editable;
      _renderSettingsSection(content, 'api_gate', gateSchema, gateValues, gateEditable);
    }
  }).catch(function() {});

  /* Trigger existing loaders */
  loadApiKeys();
  buildGateCard();
}

function _saveSettingField(section, key, value, type) {
  if (type === 'int') value = parseInt(value) || 0;
  else if (type === 'float') value = parseFloat(value) || 0;
  var body = {};
  body[key] = value;
  apiFetch('/api/settings/' + encodeURIComponent(section), {
    method: 'PUT',
    body: body
  }).then(function() {
    showToast(section + '.' + key + ' updated', 'success');
  }).catch(function(e) {
    showToast('Failed to update: ' + e.message, 'error');
  });
}

/* Backward-compat alias */
function updateSetting(section, key, value, type) {
  _saveSettingField(section, key, value, type);
}
