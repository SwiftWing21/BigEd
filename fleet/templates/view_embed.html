<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigEd — Embed View</title>

<!-- Cytoscape + dagre layout -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape-dagre/2.5.0/cytoscape-dagre.min.js"></script>

<!-- Design tokens (generated by token_bridge.py) -->
<link rel="stylesheet" href="/static/tokens.css">

<style>
/* ── Fallback tokens (used when tokens.css unavailable) ──────────────── */
:root {
  --bg:     #1e1e1e;
  --bg2:    #2c2c2c;
  --bg3:    #383838;
  --text:   #e0e0e0;
  --dim:    #a0a0a0;
  --accent: #7c3aed;
}

/* ── Reset ────────────────────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 13px;
  line-height: 1;
}

/* ── Layout ───────────────────────────────────────────────────────────── */
#embed-root {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
}

/* ── Toolbar (32px thin) ──────────────────────────────────────────────── */
#toolbar {
  display: flex;
  align-items: center;
  height: 32px;
  min-height: 32px;
  padding: 0 10px;
  background: var(--bg2);
  border-bottom: 1px solid var(--bg3);
  gap: 12px;
  user-select: none;
  -webkit-app-region: drag;          /* allow window drag on toolbar */
}

#toolbar-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

#toolbar-view-name {
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toolbar-spacer { flex: 1; }

.toolbar-badge {
  color: var(--dim);
  font-size: 11px;
  white-space: nowrap;
}

/* ── Cytoscape canvas ─────────────────────────────────────────────────── */
#cy {
  flex: 1;
  width: 100%;
  min-height: 0;
  background: var(--bg);
}

/* ── Offline placeholder ──────────────────────────────────────────────── */
#offline-placeholder {
  display: none;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
  padding: 32px;
}

#offline-placeholder.visible {
  display: flex;
}

#offline-placeholder .offline-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

#offline-placeholder .offline-icon {
  font-size: 28px;
  color: var(--dim);
}

#offline-placeholder .offline-msg {
  color: var(--dim);
  font-size: 13px;
  line-height: 1.5;
  max-width: 320px;
}

#offline-placeholder .retry-btn {
  margin-top: 8px;
  padding: 6px 20px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: transparent;
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  -webkit-app-region: no-drag;
}

#offline-placeholder .retry-btn:hover {
  background: var(--accent);
  color: #fff;
}
</style>
</head>

<body>
<div id="embed-root">

  <!-- Toolbar (32px) -->
  <div id="toolbar">
    <span id="toolbar-indicator"></span>
    <span id="toolbar-view-name">loading...</span>
    <span id="toolbar-spacer"></span>
    <span id="toolbar-zoom" class="toolbar-badge">Zoom: mid</span>
    <span id="toolbar-nodes" class="toolbar-badge">0 nodes</span>
  </div>

  <!-- Graph canvas -->
  <div id="cy"></div>

  <!-- Offline fallback -->
  <div id="offline-placeholder">
    <span class="offline-icon">&#9888;</span>
    <span class="offline-title">Dashboard Offline</span>
    <span class="offline-msg">
      Could not connect to fleet dashboard.<br>
      The graph view requires the dashboard<br>
      to be running on port 5555.
    </span>
    <button class="retry-btn" onclick="initEmbed()">Retry</button>
  </div>

</div>

<!-- View engine (loaded after DOM) -->
<script src="/static/view_engine.js"></script>

<script>
(function() {
  'use strict';

  // ── Toolbar helpers ──────────────────────────────────────────────────

  var elViewName  = document.getElementById('toolbar-view-name');
  var elZoom      = document.getElementById('toolbar-zoom');
  var elNodes     = document.getElementById('toolbar-nodes');
  var elCy        = document.getElementById('cy');
  var elOffline   = document.getElementById('offline-placeholder');

  function zoomLabel(level) {
    if (level < 0.5) return 'overview';
    if (level <= 1.0) return 'mid';
    return 'detail';
  }

  function updateToolbar(engine) {
    if (!engine || !engine.cy) return;
    var z = engine.cy.zoom();
    elZoom.textContent  = 'Zoom: ' + zoomLabel(z);
    elNodes.textContent = engine.cy.nodes().length + ' nodes';
  }

  // ── Offline placeholder ──────────────────────────────────────────────

  function showOfflinePlaceholder() {
    elCy.style.display      = 'none';
    elOffline.className     = 'visible';
    elViewName.textContent  = 'offline';
  }

  function hideOfflinePlaceholder() {
    elOffline.className     = '';
    elCy.style.display      = '';
  }

  // ── pywebview JS bridge ──────────────────────────────────────────────

  window.bigEdBridge = {
    /**
     * Called by view engine when a graph node is clicked.
     * Forwarded to native launcher via pywebview API.
     */
    onNodeClick: function(nodeId, nodeType) {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.on_graph_node_click(nodeId, nodeType);
      }
    },

    /**
     * Called by view engine when a graph edge is clicked.
     */
    onEdgeClick: function(edgeId, edgeType) {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.on_graph_edge_click(edgeId, edgeType);
      }
    },

    /**
     * Native shell can call this to switch the view.
     */
    setView: function(viewName) {
      window.location.href = '/view/embed/' + encodeURIComponent(viewName);
    },

    /**
     * Trigger a data refresh without full page reload.
     */
    refresh: function() {
      if (window._viewEngine) {
        window._viewEngine.refresh();
      }
    },

    /**
     * Return current viewport state for the native shell.
     */
    getState: function() {
      if (!window._viewEngine || !window._viewEngine.cy) {
        return { ready: false };
      }
      var cy = window._viewEngine.cy;
      return {
        ready:    true,
        zoom:     cy.zoom(),
        zoomLabel: zoomLabel(cy.zoom()),
        nodes:    cy.nodes().length,
        edges:    cy.edges().length,
        viewName: elViewName.textContent,
      };
    },
  };

  // ── Init ─────────────────────────────────────────────────────────────

  function initEmbed() {
    hideOfflinePlaceholder();

    var viewName = window.location.pathname.split('/').pop() || 'fleet-overview';
    elViewName.textContent = viewName;

    fetch('/api/views/config/' + encodeURIComponent(viewName))
      .then(function(r) {
        if (!r.ok) throw new Error('View not found: ' + r.status);
        return r.json();
      })
      .then(function(config) {
        window._viewEngine = new BigEdViewEngine({
          container:     document.getElementById('cy'),
          viewConfig:    config,
          dataEndpoint:  '/api/views/graph/' + encodeURIComponent(viewName),
          sseEndpoint:   '/api/stream',
          onNodeClick:   window.bigEdBridge.onNodeClick,
          onEdgeClick:   window.bigEdBridge.onEdgeClick,
        });

        window._viewEngine.init();

        // Keep toolbar in sync with zoom changes
        window._viewEngine.cy.on('zoom', function() {
          updateToolbar(window._viewEngine);
        });

        // Initial toolbar update after data loads
        window._viewEngine.cy.one('layoutstop', function() {
          updateToolbar(window._viewEngine);
        });

        updateToolbar(window._viewEngine);
      })
      .catch(function(err) {
        console.warn('[view_embed] init failed:', err);
        showOfflinePlaceholder();
      });
  }

  // Expose for retry button
  window.initEmbed = initEmbed;

  document.addEventListener('DOMContentLoaded', initEmbed);
})();
</script>

</body>
</html>
