# ── Marathon Research — Alexandria Library ingestion ──────────────────────────
# Idle researchers pull batches from HuggingFace science datasets and process them.
# Each task fetches a small batch, summarizes/processes, and builds the knowledge base.

# CAMEL-AI Physics (20K expert Q&A)
[[tasks]]
type = "research_loop"
[tasks.payload]
action = "ingest_batch"
source_id = "camel-physics"
batch_size = 10
destination = "tasks"

