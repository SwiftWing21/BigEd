# ── Marathon Library — RAG knowledge base building ───────────────────────────
# Idle archivists pull batches from reference datasets and ingest into RAG.
# This builds the "Alexandria Library" — searchable knowledge across all sciences.

# Cosmopedia (100K synthetic textbook lessons — all subjects)
[[tasks]]
type = "research_loop"
[tasks.payload]
action = "ingest_batch"
source_id = "cosmopedia"
batch_size = 20
destination = "rag"

