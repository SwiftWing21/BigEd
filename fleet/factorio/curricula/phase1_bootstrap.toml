[meta]
phase = 1
name = "Sandbox Building"
description = "Creative mode — blueprint-first factory building with deterministic tools"

# ── Lesson 0: Body check ──────────────────────────────────────────────────────
[[lessons]]
name = "Body check"
description = "Verify the agent has a character body"
criteria = "player.alive >= 1"
hint = "You should already have a body."
max_attempts = 5

# ── Lesson 1: Place any entity ───────────────────────────────────────────────
[[lessons]]
name = "Place any entity"
description = "Place any building from inventory"
criteria = "entities.stone-furnace >= 1 OR entities.transport-belt >= 1 OR entities.inserter >= 1"
hint = "Use PLACE action with any entity. Creative mode auto-inserts items."
max_attempts = 100

# ── Lesson 2: Place a blueprint stamp ────────────────────────────────────────
[[lessons]]
name = "Place a blueprint stamp"
description = "Successfully place a multi-entity blueprint (3+ entities at once)"
criteria = "entities.stone-furnace >= 3 OR entities.transport-belt >= 5"
hint = "Use STAMP action to place a pre-built layout like smelter_column or basic_power_station."
max_attempts = 200

# ── Lesson 3: Build a production line ────────────────────────────────────────
[[lessons]]
name = "Build a production line"
description = "Place furnaces with belts and inserters forming a line"
criteria = "entities.stone-furnace >= 4 AND entities.transport-belt >= 4 AND entities.burner-inserter >= 2"
hint = "Use the iron_smelter_4x template or smelter_column blueprint."
max_attempts = 300

# ── Lesson 4: Scale the factory ──────────────────────────────────────────────
[[lessons]]
name = "Scale the factory"
description = "20+ buildings placed — belts, inserters, furnaces"
criteria = "entities.transport-belt >= 10 AND entities.inserter >= 4 AND entities.stone-furnace >= 4"
hint = "Place more blueprints. Expand with additional smelter lines and belt segments."
max_attempts = 500
