[meta]
phase = 1
name = "Bootstrap"
description = "Place furnaces, fuel them, smelt ore into plates, build first automation"

# ── Lesson 0: Body check ──────────────────────────────────────────────────────
[[lessons]]
name = "Body check"
description = "Verify the agent has a character body"
criteria = "player.alive >= 1"
hint = "You should already have a body."
max_attempts = 5

# ── Lesson 1: Place first furnace ────────────────────────────────────────────
# Agent starts with 10 furnaces in inventory. Just place one.
[[lessons]]
name = "Place a stone furnace"
description = "Place a stone furnace from your inventory"
criteria = "entities.stone-furnace >= 1"
hint = "Use place action with entity=stone-furnace at any nearby position."
max_attempts = 100

# ── Lesson 2: Place a burner drill ──────────────────────────────────────────
[[lessons]]
name = "Place a burner mining drill"
description = "Place a burner mining drill on an ore patch"
criteria = "entities.burner-mining-drill >= 1"
hint = "Place burner-mining-drill on iron or coal ore. Must be on a resource tile."
max_attempts = 100

# ── Lesson 3: Insert items into entity ──────────────────────────────────────
# THE key behavior — put items INTO machines. Uses insert count tracker.
[[lessons]]
name = "Insert items into machines"
description = "Successfully insert items into placed entities at least 3 times"
criteria = "inserts >= 3"
hint = "Use insert action: target a furnace position, item=coal or iron-ore, count=5."
max_attempts = 200

# ── Lesson 4: Smelt plates ──────────────────────────────────────────────────
# If furnace has fuel + ore, it produces plates. Tracked via production metrics.
# produced.iron-plate counts SMELTED plates (not starting inventory).
[[lessons]]
name = "Smelt iron plates"
description = "Produce iron plates in a furnace (insert coal + iron-ore, wait)"
criteria = "produced.iron-plate >= 10"
hint = "Insert coal into furnace (fuel), then iron-ore (input). Plates are produced automatically."
max_attempts = 300

# ── Lesson 5: Scale up furnaces ─────────────────────────────────────────────
[[lessons]]
name = "Place 3 furnaces"
description = "Have at least 3 furnaces placed on the map"
criteria = "entities.stone-furnace >= 3"
hint = "Place more furnaces. You have plenty in inventory."
max_attempts = 100

# ── Lesson 6: Scale up production ───────────────────────────────────────────
[[lessons]]
name = "Smelt 50 plates"
description = "Produce at least 50 iron plates through smelting"
criteria = "produced.iron-plate >= 50"
hint = "Fuel more furnaces with coal, insert iron-ore. More furnaces = more throughput."
max_attempts = 500

# ── Lesson 7: Build automation ──────────────────────────────────────────────
[[lessons]]
name = "Build automation"
description = "5+ furnaces, 2+ drills, 100+ smelted plates"
criteria = "entities.stone-furnace >= 5 AND entities.burner-mining-drill >= 2 AND produced.iron-plate >= 100"
hint = "Place furnaces, drills, feed them all. Drills auto-mine when fueled."
max_attempts = 500
