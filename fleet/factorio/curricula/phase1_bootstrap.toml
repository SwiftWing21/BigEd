[meta]
phase = 1
name = "Bootstrap"
description = "Place furnaces, fuel them, smelt ore into plates, build first automation"

# ── Lesson 0: Body check ──────────────────────────────────────────────────────
[[lessons]]
name = "Body check"
description = "Verify the agent has a character body with health > 0"
criteria = "player.alive >= 1 AND player.health > 0"
hint = "You should already have a body."
max_attempts = 5

# ── Lesson 1: Place a furnace ────────────────────────────────────────────────
# Agent starts with 10 furnaces — just need to place one.
[[lessons]]
name = "Place a stone furnace"
description = "Place a stone furnace from your inventory"
criteria = "entities.stone-furnace >= 1"
hint = "Use place action with entity=stone-furnace at any nearby position."
max_attempts = 50

# ── Lesson 2: Place more furnaces ────────────────────────────────────────────
[[lessons]]
name = "Place 3 furnaces"
description = "Place at least 3 stone furnaces"
criteria = "entities.stone-furnace >= 3"
hint = "Keep placing furnaces at different positions."
max_attempts = 50

# ── Lesson 3: Place a burner drill ──────────────────────────────────────────
[[lessons]]
name = "Place a burner mining drill"
description = "Place a burner mining drill on an ore patch"
criteria = "entities.burner-mining-drill >= 1"
hint = "Place burner-mining-drill on iron or coal ore. Must be on a resource tile."
max_attempts = 50

# ── Lesson 4: Insert fuel ────────────────────────────────────────────────────
# The key behavior: put coal INTO a furnace.
[[lessons]]
name = "Fuel a furnace"
description = "Insert coal into a placed furnace"
criteria = "inventory.iron-plate >= 210"
hint = "Use insert action: position of a furnace, item=coal. Then insert iron-ore. Wait for plates."
max_attempts = 100

# ── Lesson 5: Smelt plates ──────────────────────────────────────────────────
# If the furnace has coal + ore, plates are produced. Agent starts with 200
# iron-plate, so this triggers when smelting produces additional plates.
[[lessons]]
name = "Smelt iron plates"
description = "Have at least 250 iron plates (start with 200, smelt 50 more)"
criteria = "inventory.iron-plate >= 250"
hint = "Insert coal then iron-ore into a furnace. Plates appear in furnace output."
max_attempts = 200

# ── Lesson 6: Place transport belt ──────────────────────────────────────────
[[lessons]]
name = "Place transport belts"
description = "Place at least 5 transport belts"
criteria = "entities.transport-belt >= 5"
hint = "Place transport-belt entities to start building logistics."
max_attempts = 100

# ── Lesson 7: Build a smelting setup ────────────────────────────────────────
# Multiple furnaces + drills + belts = automation
[[lessons]]
name = "Build automation"
description = "Have 5+ furnaces, 3+ drills, and 300+ iron plates"
criteria = "entities.stone-furnace >= 5 AND entities.burner-mining-drill >= 3 AND inventory.iron-plate >= 300"
hint = "Place more furnaces and drills. Feed them coal and ore. Belts can connect them."
max_attempts = 300
