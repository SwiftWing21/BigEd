[meta]
phase = 8
name = "Rocket & Space Science"
description = "Rocket silo, rocket parts, satellite, launch for space science"

[[lessons]]
name = "Build rocket silo"
criteria = "entities.rocket-silo >= 1"
description = "Construct a rocket silo"
hint = "Rocket silo requires massive resources — steel, concrete, processing units, electric engine units"
max_attempts = 120

[[lessons]]
name = "Produce rocket fuel"
criteria = "produced.rocket-fuel >= 10"
description = "Create rocket fuel"
hint = "Chemical plant with solid fuel (from petroleum/light oil) and light oil"
max_attempts = 80

[[lessons]]
name = "Produce low density structures"
criteria = "produced.low-density-structure >= 10"
description = "Create low density structures for rocket parts"
hint = "Assembler with copper plate, steel plate, and plastic bar"
max_attempts = 80

[[lessons]]
name = "Produce rocket control units"
criteria = "produced.rocket-control-unit >= 10"
description = "Create rocket control units"
hint = "Assembler with processing unit and speed module"
max_attempts = 80

[[lessons]]
name = "Launch rocket with satellite"
criteria = "produced.space-science-pack >= 10"
description = "Launch a rocket carrying a satellite to earn space science"
hint = "Insert satellite into rocket silo, launch when rocket is assembled"
max_attempts = 150
