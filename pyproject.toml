[project]
name = "biged"
version = "0.10.0"
requires-python = ">=3.11"
# Core runtime deps — see requirements.txt for the full pinned list
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "psutil>=5.9",
    "tomlkit>=0.12",
    "google-generativeai>=0.8",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "cryptography>=42.0",
    "fastmcp>=2.0",
    "nvidia-ml-py>=12.0",
]

[project.optional-dependencies]
launcher = [
    "pillow>=10.0.0",
    "pystray>=0.19",
    "pywebview>=5.0",
]
fleet = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "cryptography>=42.0",
    "fastmcp>=2.0",
    "nvidia-ml-py>=12.0",
    "tomlkit>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["fleet"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    "node_modules",
    "fleet/skills/",
    "fleet/factorio/",
    "tests/factorio/",
    "autoresearch/",
    "deploy/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, unused imports)
    "W",   # pycodestyle warnings
    "I",   # isort
]
ignore = [
    "E501",   # line too long
    "E402",   # module-level import not at top -- fleet uses lazy imports by design
    "F401",   # unused import -- many intentional re-exports
]

[tool.ruff.lint.isort]
known-first-party = ["db", "config", "providers", "comms", "health_monitor"]

[tool.coverage.run]
source = ["fleet"]
omit = [
    "fleet/skills/*",
    "fleet/factorio/*",
    "fleet/tenants/*",
    "fleet/knowledge/*",
    "tests/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
